<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Players</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Players</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>async function load(){await setNav();try{const t=await getTournament(qs("slug"));const {data,error}=await sb.from("player_registrations").select("status,is_captain,players(full_name,display_name,playing_role,cricheroes_profile_url)").eq("tournament_id",t.id).eq("status","approved");if(error)throw error;app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Players</h1><div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>Captain</th><th>CricHeroes</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${esc(r.players?.display_name||r.players?.full_name)}</td><td>${esc(r.players?.playing_role||"—")}</td><td>${r.is_captain?"Captain":"—"}</td><td>${r.players?.cricheroes_profile_url?`<a target="_blank" href="${esc(r.players.cricheroes_profile_url)}">Profile ↗</a>`:"—"}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No approved players.</td></tr>`}</tbody></table></div></div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();</script></body></html>
