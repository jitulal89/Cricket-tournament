<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-Auction Setup</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Pre-Auction Setup</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>
let T,REGS=[],CATS=[],TEAMS=[];
async function data(){const [{data:r,error:re},{data:c,error:ce},{data:tm,error:te}]=await Promise.all([sb.from("player_registrations").select("id,status,is_captain,auction_category_id,player_id,players(id,full_name,display_name,playing_role)").eq("tournament_id",T.id).eq("status","approved").order("registered_at"),sb.from("auction_categories").select("id,name,minimum_bid").eq("tournament_id",T.id).order("name"),sb.from("teams").select("id,name,captain_id").eq("tournament_id",T.id).order("name")]);if(re||ce||te)throw re||ce||te;REGS=r||[];CATS=c||[];TEAMS=tm||[]}
function render(){const captainIds=new Set(TEAMS.map(x=>x.captain_id).filter(Boolean));const auction=REGS.filter(r=>!captainIds.has(r.player_id));const capOk=TEAMS.length===Number(T.number_of_teams)&&TEAMS.every(x=>x.captain_id);const catOk=auction.length>0&&auction.every(x=>x.auction_category_id);const ready=Number(T.number_of_teams)>=2&&capOk&&CATS.length>0&&catOk;app.innerHTML=`<div class="row between"><div><h1 style="font-size:36px">Pre-Auction Setup</h1><p class="muted">${esc(T.name)}</p></div><a class="btn secondary" href="admin-tournament.html?slug=${encodeURIComponent(T.slug)}">← Tournament</a></div><div class="card section"><h2>1. Number of Teams</h2><p class="muted">Based on approved registrations: <strong>${REGS.length} players</strong>. Suggested starting point: ${Math.max(2,Math.floor(REGS.length/5)||2)} teams.</p><label>Teams planned</label><input id="teamCount" type="number" min="2" value="${Number(T.number_of_teams)||4}"><button class="btn" onclick="saveTeamCount()">Save & Create Team Slots</button></div><div class="card section"><h2>2. Select Captains</h2><p class="muted">Select one approved player per team. Captains are automatically excluded from the auction.</p><div class="table-wrap"><table class="table"><thead><tr><th>Team</th><th>Captain</th></tr></thead><tbody>${TEAMS.map(team=>`<tr><td><strong>${esc(team.name)}</strong></td><td><select onchange="saveCaptain('${team.id}',this.value)"><option value="">Select Captain</option>${REGS.map(r=>{const selected=TEAMS.some(x=>x.id!==team.id&&x.captain_id===r.player_id);return `<option value="${r.player_id}" ${r.player_id===team.captain_id?"selected":""} ${selected?"disabled":""}>${esc(r.players?.display_name||r.players?.full_name)}</option>`}).join("")}</select></td></tr>`).join("")||`<tr><td colspan="2" class="empty">Save the number of teams first.</td></tr>`}</tbody></table></div></div><div class="card section"><h2>3. Auction Categories</h2><p class="muted">Create categories on the tournament management page. Every non-captain must be assigned one category.</p><a class="btn secondary" href="admin-tournament.html?slug=${encodeURIComponent(T.slug)}">Manage Categories & Minimum Bids</a><div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Player</th><th>Category / Minimum Bid</th></tr></thead><tbody>${auction.map(r=>`<tr><td><strong>${esc(r.players?.display_name||r.players?.full_name)}</strong><br><span class="muted">${esc(r.players?.playing_role||"—")}</span></td><td><select onchange="saveCategory('${r.id}',this.value)"><option value="">Select Category</option>${CATS.map(c=>`<option value="${c.id}" ${r.auction_category_id===c.id?"selected":""}>${esc(c.name)} — ${money(c.minimum_bid)}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan="2" class="empty">No approved players available for auction.</td></tr>`}</tbody></table></div></div><div class="card section"><h2>4. Auction Readiness</h2><div class="${ready?"notice":"warning"}">${ready?"✅ All checks passed. The auction is ready to start.":"Complete the team count, all captain selections, at least one category, and category assignment for every auction player."}</div><div class="grid section"><div><div class="stat">${TEAMS.filter(x=>x.captain_id).length}/${Number(T.number_of_teams)||0}</div><div class="muted">Captains</div></div><div><div class="stat">${auction.length}</div><div class="muted">Auction Players</div></div><div><div class="stat">${auction.filter(x=>x.auction_category_id).length}/${auction.length}</div><div class="muted">Categorized</div></div></div><button class="btn success" ${ready?"":"disabled"} onclick="markReady()">Mark Auction Ready</button></div>`}
async function saveTeamCount(){const n=Number(teamCount.value);if(!Number.isInteger(n)||n<2)return alert("Number of teams must be at least 2.");const {error}=await sb.from("tournaments").update({number_of_teams:n}).eq("id",T.id);if(error)return alert(error.message);const {data:existing}=await sb.from("teams").select("id,name").eq("tournament_id",T.id);const names=new Set((existing||[]).map(x=>x.name));for(let i=0;i<n;i++){const name="Team "+String.fromCharCode(65+i);if(!names.has(name)){const {error:e}=await sb.from("teams").insert({tournament_id:T.id,name});if(e)return alert(e.message)}}T.number_of_teams=n;await data();render()}
async function saveCaptain(teamId,playerId){const team=TEAMS.find(x=>x.id===teamId);if(team?.captain_id){await sb.from("player_registrations").update({is_captain:false}).eq("tournament_id",T.id).eq("player_id",team.captain_id)}if(playerId){const other=TEAMS.find(x=>x.id!==teamId&&x.captain_id===playerId);if(other){await sb.from("teams").update({captain_id:null}).eq("id",other.id)}await sb.from("player_registrations").update({is_captain:false,auction_category_id:null}).eq("tournament_id",T.id).eq("player_id",playerId);await sb.from("teams").update({captain_id:playerId}).eq("id",teamId);await sb.from("player_registrations").update({is_captain:true,auction_category_id:null}).eq("tournament_id",T.id).eq("player_id",playerId)}else{await sb.from("teams").update({captain_id:null}).eq("id",teamId)}await data();render()}
async function saveCategory(regId,catId){const {error}=await sb.from("player_registrations").update({auction_category_id:catId||null,is_captain:false}).eq("id",regId);if(error)alert(error.message);else{await data();render()}}
async function markReady(){const {error}=await sb.from("auction_settings").update({auction_status:"ready"}).eq("tournament_id",T.id);if(error)return alert(error.message);alert("Auction is marked READY.");render()}
async function load(){if(!(await requireAdmin()))return;await setNav();try{T=await getTournament(qs("slug"));await data();render()}catch(e){app.innerHTML=msg(e.message,"err")}}load();
</script></body></html>
