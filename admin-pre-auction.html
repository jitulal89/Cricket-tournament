<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Auction Setup</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header class="top"><div class="brand">🏏 Pre-Auction Setup</div><nav id="nav" class="nav"></nav></header>
<main id="app"></main>
<script src="app.js"></script>
<script>
let T=null, REGS=[], CATS=[], TEAMS=[], AUCTION=null;

async function loadData(){
 const results=await Promise.all([
   sb.from("player_registrations").select("id,status,is_captain,auction_category_id,player_id,players(id,full_name,display_name,playing_role)").eq("tournament_id",T.id).eq("status","approved").order("registered_at"),
   sb.from("auction_categories").select("id,name,minimum_bid,auction_order").eq("tournament_id",T.id).order("auction_order",{ascending:true,nullsFirst:false}).order("name"),
   sb.from("teams").select("id,name,captain_id").eq("tournament_id",T.id).order("name"),
   sb.from("auction_settings").select("*").eq("tournament_id",T.id).maybeSingle()
 ]);
 if(results.some(x=>x.error)) throw results.find(x=>x.error).error;
 REGS=results[0].data||[]; CATS=results[1].data||[]; TEAMS=results[2].data||[]; AUCTION=results[3].data;
}

function captainIds(){return new Set(TEAMS.map(t=>t.captain_id).filter(Boolean))}
function auctionPlayers(){const ids=captainIds();return REGS.filter(r=>!ids.has(r.player_id))}
function checks(){
 const n=Number(T.number_of_teams)||0;
 const teamsOK=n>=2 && TEAMS.length===n;
 const captainsOK=teamsOK && TEAMS.every(t=>!!t.captain_id);
 const catsOK=CATS.length>0;
 const players=auctionPlayers();
 const categoriesOK=players.length>0 && players.every(p=>!!p.auction_category_id);
 return {teamsOK,captainsOK,catsOK,categoriesOK,ready:teamsOK&&captainsOK&&catsOK&&categoriesOK};
}

function render(){
 const c=checks(), players=auctionPlayers();
 app.innerHTML=`
 <div class="row between">
   <div><h1 style="font-size:36px">Pre-Auction Setup</h1><p class="muted">${esc(T.name)}</p></div>
   <div class="row">
    <a class="btn secondary" href="admin-tournament.html?slug=${encodeURIComponent(T.slug)}">← Tournament</a>
    <a class="btn secondary" href="admin-auction.html?slug=${encodeURIComponent(T.slug)}">Auction →</a>
   </div>
 </div>

 <div class="notice section"><strong>Before the auction can start:</strong> decide the number of teams, select one captain for every team, create categories with minimum bids, and assign every non-captain to a category.</div>

 <div class="grid section">
  <div class="card"><div class="stat">${REGS.length}</div><div class="muted">Approved Players</div></div>
  <div class="card"><div class="stat">${TEAMS.filter(t=>t.captain_id).length}/${Number(T.number_of_teams)||0}</div><div class="muted">Captains Selected</div></div>
  <div class="card"><div class="stat">${players.length}</div><div class="muted">Players for Auction</div></div>
  <div class="card"><div class="stat">${players.filter(p=>p.auction_category_id).length}/${players.length}</div><div class="muted">Players Categorized</div></div>
 </div>

 <div class="card section">
  <h2>1️⃣ Decide Number of Teams</h2>
  <p class="muted">You currently have <strong>${REGS.length}</strong> approved registrations.</p>
  <div class="grid">
   <div><label>Number of teams</label><input id="teamCount" type="number" min="2" value="${Number(T.number_of_teams)||4}"></div>
   <div class="row" style="align-items:end"><button class="btn" onclick="saveTeams()">Save Number of Teams</button></div>
  </div>
  <div class="${c.teamsOK?'msg ok':'warning'}">${c.teamsOK?'✅ Team slots created.':'⚠️ Save the number of teams to create team slots.'}</div>
 </div>

 <div class="card section">
  <h2>2️⃣ Select Captains</h2>
  <p class="muted">Captains are assigned directly to their team and are automatically excluded from the auction.</p><p><a class="btn secondary" href="admin-captains.html?slug=${encodeURIComponent(T.slug)}">👤 Manage Captain Login Accounts</a></p>
  ${TEAMS.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Team</th><th>Captain</th></tr></thead><tbody>
  ${TEAMS.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td><select onchange="setCaptain('${t.id}',this.value)">
   <option value="">Select Captain</option>
   ${REGS.map(r=>{const used=TEAMS.some(x=>x.id!==t.id&&x.captain_id===r.player_id);return `<option value="${r.player_id}" ${r.player_id===t.captain_id?"selected":""} ${used?"disabled":""}>${esc(r.players?.display_name||r.players?.full_name)}</option>`}).join("")}
  </select></td></tr>`).join("")}</tbody></table></div>`
  :`<div class="empty">Create the team slots in Step 1 first.</div>`}
  <div class="${c.captainsOK?'msg ok':'warning'}">${c.captainsOK?'✅ Every team has a captain.':'⚠️ Select a captain for every team.'}</div>
 </div>

 <div class="card section">
  <h2>3️⃣ Auction Categories, Minimum Bids & Order</h2>
  <p class="muted">Each category has its own minimum bid. Use ↑ / ↓ to decide which category goes first. Players inside each category will be randomly shuffled when the auction starts.</p>
  <div class="grid">
   <div><label>New category</label><input id="catName" placeholder="A Grade"></div>
   <div><label>Minimum bid</label><input id="catBid" type="number" min="0" value="${Number(AUCTION?.default_minimum_bid)||100}"></div>
   <div class="row" style="align-items:end"><button class="btn" onclick="addCat()">+ Add Category</button></div>
  </div>
  ${CATS.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Order / Category</th><th>Minimum Bid</th><th>Actions</th></tr></thead><tbody>
  ${CATS.map((c,i)=>`<tr><td><strong>${i+1}. ${esc(c.name)}</strong><br><input id="cn_${c.id}" value="${esc(c.name)}"></td><td><input id="cb_${c.id}" type="number" min="0" value="${Number(c.minimum_bid)||0}"></td><td><button class="btn secondary" onclick="moveCat('${c.id}',-1)" ${i===0?"disabled":""}>↑</button> <button class="btn secondary" onclick="moveCat('${c.id}',1)" ${i===CATS.length-1?"disabled":""}>↓</button> <button class="btn" onclick="updateCat('${c.id}')">Save</button> <button class="btn danger" onclick="deleteCat('${c.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`
  :`<div class="empty">No categories created yet.</div>`}
  <div class="${c.catsOK?'msg ok':'warning'}">${c.catsOK?'✅ Categories are available.':'⚠️ Create at least one category.'}</div>
 </div>

 <div class="card section">
  <h2>4️⃣ Assign Players to Categories</h2>
  <p class="muted"><strong>${players.length}</strong> players will enter the auction. Captains are excluded.</p>
  ${players.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>Category</th></tr></thead><tbody>
  ${players.map(r=>`<tr><td><strong>${esc(r.players?.display_name||r.players?.full_name)}</strong></td><td>${esc(r.players?.playing_role||"—")}</td><td>
   <select onchange="setCategory('${r.id}',this.value)"><option value="">Select Category</option>
   ${CATS.map(c=>`<option value="${c.id}" ${r.auction_category_id===c.id?"selected":""}>${esc(c.name)} — ${money(c.minimum_bid)}</option>`).join("")}
   </select></td></tr>`).join("")}</tbody></table></div>`
  :`<div class="empty">No auction players. Approve players and select captains first.</div>`}
  <div class="${c.categoriesOK?'msg ok':'warning'}">${c.categoriesOK?'✅ Every auction player has a category.':'⚠️ Assign a category to every auction player.'}</div>
 </div>

 <div class="card section">
  <h2>5️⃣ Final Readiness</h2>
  <div class="${c.ready?'notice':'warning'}">
   ${c.ready?"🎉 Everything is complete. You can mark the auction READY.":"Complete all four setup steps before starting the auction."}
  </div>
  <div class="row section">
   <button class="btn success" ${c.ready?"":"disabled"} onclick="markReady()">✓ Mark Auction Ready</button>
   <a class="btn secondary" href="admin-tournament.html?slug=${encodeURIComponent(T.slug)}">Back to Tournament</a>
  </div>
 </div>`;
}

async function saveTeams(){
 const n=Number(teamCount.value);
 if(!Number.isInteger(n)||n<2)return alert("Enter at least 2 teams.");
 const {error}=await sb.from("tournaments").update({number_of_teams:n}).eq("id",T.id);
 if(error)return alert(error.message);
 const {data:existing}=await sb.from("teams").select("id,name").eq("tournament_id",T.id);
 const names=new Set((existing||[]).map(x=>x.name));
 for(let i=0;i<n;i++){
  const name="Team "+String.fromCharCode(65+i);
  if(!names.has(name)){
   const {error:e}=await sb.from("teams").insert({tournament_id:T.id,name});
   if(e)return alert(e.message);
  }
 }
 await loadData();render();
}

async function setCaptain(teamId,playerId){
 const team=TEAMS.find(t=>t.id===teamId);
 if(team?.captain_id){
  await sb.from("player_registrations").update({is_captain:false,auction_category_id:null}).eq("tournament_id",T.id).eq("player_id",team.captain_id);
 }
 if(playerId){
  const other=TEAMS.find(t=>t.id!==teamId&&t.captain_id===playerId);
  if(other)await sb.from("teams").update({captain_id:null}).eq("id",other.id);
  await sb.from("player_registrations").update({is_captain:false,auction_category_id:null}).eq("tournament_id",T.id).eq("player_id",playerId);
  await sb.from("teams").update({captain_id:playerId}).eq("id",teamId);
  await sb.from("player_registrations").update({is_captain:true,auction_category_id:null}).eq("tournament_id",T.id).eq("player_id",playerId);
 }else{
  await sb.from("teams").update({captain_id:null}).eq("id",teamId);
 }
 await loadData();render();
}

async function addCat(){
 const name=catName.value.trim(), bid=Number(catBid.value)||0;
 if(!name)return alert("Enter a category name.");
 const {error}=await sb.from("auction_categories").insert({tournament_id:T.id,name,minimum_bid:bid,auction_order:CATS.length+1});
 if(error)return alert(error.message);
 await loadData();render();
}
async function updateCat(id){
 const name=document.getElementById("cn_"+id).value.trim(), bid=Number(document.getElementById("cb_"+id).value)||0;
 const {error}=await sb.from("auction_categories").update({name,minimum_bid:bid}).eq("id",id);
 if(error)return alert(error.message);
 await loadData();render();
}
async function moveCat(id,dir){ const i=CATS.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=CATS.length)return;[CATS[i],CATS[j]]=[CATS[j],CATS[i]];for(let k=0;k<CATS.length;k++){const {error}=await sb.from('auction_categories').update({auction_order:k+1}).eq('id',CATS[k].id);if(error)return alert(error.message)}await loadData();render();}
async function deleteCat(id){
 if(!confirm("Delete this category? Players assigned to it will become uncategorized."))return;
 const {error}=await sb.from("auction_categories").delete().eq("id",id);
 if(error)return alert(error.message);
 await loadData();render();
}
async function setCategory(regId,catId){
 const {error}=await sb.from("player_registrations").update({auction_category_id:catId||null,is_captain:false}).eq("id",regId);
 if(error)return alert(error.message);
 await loadData();render();
}
async function markReady(){
 const c=checks();if(!c.ready)return alert("Complete all setup steps first."); for(let i=0;i<CATS.length;i++){const {error:e}=await sb.from('auction_categories').update({auction_order:i+1}).eq('id',CATS[i].id);if(e)return alert(e.message);}
 const {error}=await sb.from("auction_settings").update({auction_status:"ready"}).eq("tournament_id",T.id);
 if(error)return alert(error.message);
 await loadData();render();
 alert("Auction is READY.");
}
async function load(){if(!(await requireAdmin()))return;await setNav();try{T=await getTournament(qs("slug"));await loadData();render()}catch(e){app.innerHTML=msg(e.message,"err")}}
load();
</script></body></html>
