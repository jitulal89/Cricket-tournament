<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Cricket Tournament · Admin</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=10"></script><script>
async function load(){if(!(await requireAdmin()))return;await setNav();const {data,error}=await sb.from("tournaments").select("*").order("created_at",{ascending:false});if(error){app.innerHTML=msg(error.message,"err");return}app.innerHTML=`<div class="row between"><div><h1 style="font-size:36px">Admin Dashboard</h1><p class="muted">Create and manage independent tournaments.</p></div><a class="btn" href="admin-create.html">+ Create Tournament</a></div><div class="grid section">${(data||[]).map(t=>`<div class="card"><div class="row">${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:"<div class='logo' style='display:grid;place-items:center;font-size:28px'>🏏</div>"}<div><h3>${esc(t.name)}</h3><span class="pill">${esc(t.status)}</span></div></div><p class="muted">${esc(t.description||"No description")}</p><p><strong>Teams:</strong> ${t.number_of_teams||"Not decided"}</p><div class="row"><a class="btn" href="admin-tournament.html?slug=${encodeURIComponent(t.slug)}">Manage</a><a class="btn secondary" href="tournament.html?slug=${encodeURIComponent(t.slug)}">Public</a></div></div>`).join("")||`<div class="card empty">No tournaments yet.</div>`}</div>`}load();
</script></body></html>
