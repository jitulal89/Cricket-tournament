<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Live Auction</title><link rel="stylesheet" href="styles.css"><style>.live{background:#111827;color:#fff;border-radius:18px;padding:24px}.bid{font-size:42px;font-weight:900}.teambox{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:18px}.leading{border-color:#16a34a;background:#f0fdf4}.bid-input{font-size:26px;text-align:center;font-weight:800}.big{font-size:20px;padding:16px;width:100%}</style></head>
<body><header class="top"><div class="brand">🏏 Captain Live Auction</div><nav id="nav" class="nav"></nav></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let T,ME,S,TEAM,PLAYER,CAT,WAL,A,channel;const appx=document.getElementById('app');
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='captain-login.html?slug='+encodeURIComponent(qs('slug'));return}try{T=await getTournament(qs('slug'));const {data:p,error}=await sb.rpc('claim_captain_access',{p_tournament_id:T.id});if(error)throw error;ME=p;if(!ME?.team_id)throw new Error('Your captain login is not assigned to a team yet.');const {data:tm,error:te}=await sb.from('teams').select('*').eq('id',ME.team_id).single();if(te)throw te;TEAM=tm;await refresh();subscribe()}catch(e){appx.innerHTML=msg(e.message,'err')}}
let MINIMUM_BID=0;
async function refresh(){const [s,w,a]=await Promise.all([sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle(),sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id).eq('team_id',TEAM.id).maybeSingle(),sb.from('auction_settings').select('bid_increment,default_minimum_bid').eq('tournament_id',T.id).maybeSingle()]);S=s.data;WAL=w.data;A=a.data;PLAYER=null;CAT=null;MINIMUM_BID=0;
 if(S?.current_auction_player_id){
   const {data:mb,error:mbe}=await sb.rpc('get_current_captain_auction_info',{
     p_tournament_id:T.id
   });
   if(!mbe && mb){
     MINIMUM_BID=Number(mb.minimum_bid||0);
     CAT={name:mb.category_name||'Category',minimum_bid:MINIMUM_BID};
   }
 }
 const auctionPlayerId=S?.current_auction_player_id||null;
 if(auctionPlayerId){
   const {data:ap,error:ape}=await sb.from('auction_players').select('id,category_id,player_registration_id').eq('id',auctionPlayerId).eq('tournament_id',T.id).maybeSingle();
   if(ap){
     const [{data:cat},{data:pr}]=await Promise.all([
       ap.category_id?sb.from('auction_categories').select('*').eq('id',ap.category_id).maybeSingle():Promise.resolve({data:null}),
       sb.from('player_registrations').select('player_id').eq('id',ap.player_registration_id).maybeSingle()
     ]);
     if(cat) CAT=cat;
     if(pr?.player_id){
       const {data:pl}=await sb.from('players').select('full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url').eq('id',pr.player_id).maybeSingle();
       PLAYER=pl;
     }
   }
 } else if(S?.current_player_id){
   const {data:r}=await sb.from('player_registrations').select('auction_category_id,players(full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url)').eq('tournament_id',T.id).eq('player_id',S.current_player_id).eq('status','approved').maybeSingle();
   PLAYER=r?.players||null;CAT=r?.auction_category_id?await getCat(r.auction_category_id):null;
 }
 render()}
async function getCat(id){const {data}=await sb.from('auction_categories').select('*').eq('id',id).single();return data}
function render(){if(!S){appx.innerHTML='<div class="card">Auction has not started yet. Please wait for the admin.</div>';return}if(S.status==='completed'){appx.innerHTML='<div class="card"><h1>🏆 Auction Completed</h1><p>Thank you, '+esc(ME.display_name||'Captain')+'.</p></div>';return}const min=MINIMUM_BID,inc=Number(A?.bid_increment||0)||10;const next=S.leading_team_id?Number(S.current_bid)+inc:Number(S.current_bid||min);appx.innerHTML=`<div class="row between"><div><h1 style="font-size:32px">${esc(T.name)}</h1><p class="muted">Captain: ${esc(ME.display_name||'')} · ${esc(TEAM.name)}</p></div><button class="btn secondary" onclick="logout()">Logout</button></div><div class="live section">
 <div class="pill">${esc(CAT?.name||'Category')}</div>
 <div class="player-profile" style="margin-top:14px">
  <img src="${esc(PLAYER?.profile_photo_url||'')} " class="player-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">
  <div class="player-photo placeholder" style="display:${PLAYER?.profile_photo_url?'none':'grid'}">🏏</div>
  <div class="player-info">
   <h2 style="font-size:34px;margin:0 0 5px">${esc(PLAYER?.display_name||PLAYER?.full_name||'Waiting for player')}</h2>
   <div class="role-badge">${esc((PLAYER?.playing_role||'').replace('_',' ')||'Player')}</div>
   <div class="muted-light">${esc(PLAYER?.batting_style||'')} ${PLAYER?.bowling_style?' · '+esc(PLAYER.bowling_style):''}</div>
  </div>
 </div>
 <div class="stats-grid">
  <div><b>${PLAYER?.cricheroes_matches??'—'}</b><span>Matches</span></div>
  <div><b>${PLAYER?.cricheroes_runs??'—'}</b><span>Runs</span></div>
  <div><b>${PLAYER?.cricheroes_wickets??'—'}</b><span>Wickets</span></div>
  <div><b>${PLAYER?.cricheroes_strike_rate??'—'}</b><span>SR</span></div>
  <div><b>${PLAYER?.cricheroes_economy??'—'}</b><span>Economy</span></div>
 </div>
 ${PLAYER?.cricheroes_profile_url?`<a target="_blank" rel="noopener" href="${esc(PLAYER.cricheroes_profile_url)}" class="profile-link">View CricHeroes Profile ↗</a>`:''}
 <div style="margin-top:12px">Minimum ${money(min)}</div>
 <div class="bid">${money(S.current_bid)}</div>
 <div>${S.leading_team_id?`Leading team: ${esc(S.leading_team_id===TEAM.id?TEAM.name:'Another team')}`:'No bid yet'}</div>
</div><div class="teambox section ${S.leading_team_id===TEAM.id?'leading':''}"><div class="row between"><h2>${esc(TEAM.name)}</h2><span class="pill">Remaining Purse: ${money(WAL?.remaining_purse)}</span></div><label>Your Bid</label><input id="myBid" class="bid-input" type="number" min="${next}" value="${next}"><button class="btn big" onclick="bid()">🔨 PLACE BID</button><p class="muted">Your bid will be visible to the auction admin and all other captains immediately.</p></div>`}
async function bid(){const val=Number(document.getElementById('myBid').value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:TEAM.id,p_amount:val,p_source:'captain'});if(error)return alert(error.message);await refresh()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('captain-'+T.id).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},refresh).subscribe()}
load();
</script></body></html>
