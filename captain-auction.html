<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Live Auction</title><link rel="stylesheet" href="styles.css"><style>.live{background:#111827;color:#fff;border-radius:18px;padding:24px}.bid{font-size:42px;font-weight:900}.teambox{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:18px}.leading{border-color:#16a34a;background:#f0fdf4}.bid-input{font-size:26px;text-align:center;font-weight:800}.big{font-size:20px;padding:16px;width:100%}.auction-overview{margin-top:20px}.overview-team{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.overview-team h3{margin:0}.overview-team .purse{font-size:20px;font-weight:900;color:#166534}.roster-list{margin:10px 0 0;padding-left:20px}.roster-list li{margin:5px 0}.roster-empty{font-size:13px;color:#6b7280;margin-top:8px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:0 0 48px}.avatar.placeholder{display:grid;place-items:center;font-size:22px;border:1px solid #d1d5db;background:#f3f4f6;color:#64748b}</style></head>
<body><header class="top"><div class="brand">🏏 Captain Live Auction</div><nav id="nav" class="nav"></nav></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let T,ME,S,TEAM,PLAYER,CAT,WAL,A,OVERVIEW=[],REGISTERED=[],APSTATUS=[],CATEGORY_MAP={},CAPVIEW='auction',channel;const appx=document.getElementById('app');
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='captain-login.html?slug='+encodeURIComponent(qs('slug'));return}try{T=await getTournament(qs('slug'));const {data:p,error}=await sb.rpc('claim_captain_access',{p_tournament_id:T.id});if(error)throw error;ME=p;if(!ME?.team_id)throw new Error('Your captain login is not assigned to a team yet.');const {data:tm,error:te}=await sb.from('teams').select('*').eq('id',ME.team_id).single();if(te)throw te;TEAM=tm;await loadCaptainPlayerLists();await refresh();subscribe()}catch(e){appx.innerHTML=msg(e.message,'err')}}
let MINIMUM_BID=0;

async function loadCaptainPlayerLists(){
 const [regRes,apRes,catRes]=await Promise.all([
  sb.from('player_registrations').select('id,player_id,auction_category_id,is_captain,status,players(id,full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url)').eq('tournament_id',T.id).eq('status','approved'),
  sb.from('auction_players').select('id,player_registration_id,category_id,auction_status').eq('tournament_id',T.id),
  sb.from('auction_categories').select('id,name').eq('tournament_id',T.id)
 ]);
 if(regRes.error)throw regRes.error;
 REGISTERED=regRes.data||[];
 APSTATUS=apRes.error?[]:(apRes.data||[]);
 CATEGORY_MAP=Object.fromEntries((catRes.data||[]).map(c=>[c.id,c.name]));
}
function captainPlayerCard(r){
 const p=r.players||{};
 return `<div class="overview-team" style="display:flex;gap:12px;align-items:flex-start">
  <img src="${esc(p.profile_photo_url||'')}" class="avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt=""><div class="avatar placeholder" style="display:${p.profile_photo_url?'none':'grid'}">🏏</div>
  <div style="min-width:0;flex:1"><div class="row between"><strong>${esc(p.display_name||p.full_name||'Player')}</strong>${r.is_captain?'<span class="pill">Captain</span>':''}</div>
  <div class="mini">${esc((p.playing_role||'—').replace('_',' '))} · ${esc(p.batting_style||'—')} · ${esc(p.bowling_style||'—')}</div>
  <div class="mini" style="margin-top:6px">${p.cricheroes_matches??'—'} Matches · ${p.cricheroes_runs??'—'} Runs · ${p.cricheroes_wickets??'—'} Wickets</div>
  <div class="mini">SR ${p.cricheroes_strike_rate??'—'} · Econ ${p.cricheroes_economy??'—'} ${r.auction_category_id?`· ${esc(CATEGORY_MAP[r.auction_category_id]||'Category')}`:''}</div>
  ${p.cricheroes_profile_url?`<a target="_blank" rel="noopener" href="${esc(p.cricheroes_profile_url)}">CricHeroes profile ↗</a>`:''}
  </div></div>`;
}
function allRegisteredPlayersSection(){
 return `<section class="card section"><div class="row between"><div><h2>👥 All Registered Players</h2><p class="muted">Approved tournament registrations with player profile and available statistics.</p></div><span class="pill">${REGISTERED.length} players</span></div><div class="grid">${REGISTERED.slice().sort((a,b)=>(a.players?.display_name||a.players?.full_name||'').localeCompare(b.players?.display_name||b.players?.full_name||'')).map(captainPlayerCard).join('')||'<div class="empty">No approved players registered yet.</div>'}</div></section>`;
}

function captainNav(){
 const items=[['registered','👥 Registered Players'],['auction','🔨 Live Auction'],['teams','🏆 Teams & Results']];
 document.getElementById('nav').innerHTML=items.map(([id,label])=>`<button class="btn secondary" style="margin:3px" onclick="CAPVIEW='${id}';render()">${label}</button>`).join('');
}
function captainTeamsSection(){
 return `<section class="card section"><h2>🏆 All Teams & Player Details</h2><p class="muted">Full team rosters, photos and auction purchase prices.</p><div class="grid section">${OVERVIEW.map(t=>`<div class="overview-team"><div class="row between"><h3>${esc(t.name)}</h3><span class="pill">${t.players.length} players</span></div><div class="mini">Captain: ${esc(t.captain)}</div><div class="purse">Total spent: ${money(t.players.reduce((s,p)=>s+Number(p.price||0),0))}</div><div class="grid section">${t.players.map(p=>`<div class="overview-team" style="display:flex;gap:10px;align-items:center"><img src="${esc(p.photo||'')}" class="avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt=""><div class="avatar placeholder" style="display:${p.photo?'none':'grid'}">🏏</div><div style="flex:1;min-width:0"><strong>${esc(p.name)}</strong><div class="mini">${esc(p.role||'Player')}</div></div><strong>${money(p.price)}</strong></div>`).join('')||'<div class="roster-empty">No players purchased</div>'}</div></div>`).join('')}</div></section>`;
}

function remainingPlayersSection(){
 if(!S||S.status==='completed')return '';
 const currentReg=REGISTERED.find(r=>r.player_id===S.current_player_id);
 const currentAp=APSTATUS.find(ap=>ap.player_registration_id===currentReg?.id);
 const categoryId=currentAp?.category_id||currentReg?.auction_category_id||CAT?.id;
 if(!categoryId)return `<section class="card section"><h2>⏳ Remaining Players</h2><p class="muted">Current category is not available yet. Refresh to reload.</p><button class="btn secondary" onclick="loadCaptainPlayerLists().then(refresh)">Refresh</button></section>`;
 let queue=Array.isArray(S.category_queues?.[categoryId])?S.category_queues[categoryId]:[];
 if(!queue.length)queue=REGISTERED.filter(r=>r.auction_category_id===categoryId&&!r.is_captain).map(r=>r.player_id).filter(Boolean);
 const regById=new Map(REGISTERED.map(r=>[r.id,r]));
 const statusByPlayer=new Map();
 for(const ap of APSTATUS){const reg=regById.get(ap.player_registration_id);if(reg?.player_id)statusByPlayer.set(reg.player_id,String(ap.auction_status||'').toLowerCase());}
 const soldIds=new Set(OVERVIEW.flatMap(t=>t.players.map(p=>p.player_id).filter(Boolean)));
 const soldFromSquad=new Set();
 // auction_squad is readable to captains and is a reliable sold-player source.
 const remaining=queue.filter(pid=>pid!==S.current_player_id&&!soldFromSquad.has(pid)&&!soldIds.has(pid)&&!['sold','unsold'].includes(statusByPlayer.get(pid)));
 const rows=remaining.map(pid=>REGISTERED.find(r=>r.player_id===pid)).filter(Boolean);
 return `<section class="card section"><div class="row between"><div><h2>🏏 Remaining Players in Current Category</h2><p class="muted">${esc(CATEGORY_MAP[categoryId]||CAT?.name||'Current category')} · not yet sold or marked unsold</p></div><span class="pill">${rows.length} left</span></div><div class="grid">${rows.map(captainPlayerCard).join('')||'<div class="empty">No remaining players in this category.</div>'}</div></section>`;
}
async function refresh(){const [s,w,a]=await Promise.all([sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle(),sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id).eq('team_id',TEAM.id).maybeSingle(),sb.from('auction_settings').select('bid_increment,default_minimum_bid').eq('tournament_id',T.id).maybeSingle()]);S=s.data;WAL=w.data;A=a.data;PLAYER=null;CAT=null;MINIMUM_BID=0;
 if(S?.current_auction_player_id){
   const {data:mb,error:mbe}=await sb.rpc('get_current_captain_auction_info',{
     p_tournament_id:T.id
   });
   if(!mbe && mb){
     MINIMUM_BID=Number(mb.minimum_bid||0);
     CAT={name:mb.category_name||'Category',minimum_bid:MINIMUM_BID};
   }
 }
 const auctionPlayerId=S?.current_auction_player_id||null;
 if(auctionPlayerId){
   const {data:ap,error:ape}=await sb.from('auction_players').select('id,category_id,player_registration_id').eq('id',auctionPlayerId).eq('tournament_id',T.id).maybeSingle();
   if(ap){
     const [{data:cat},{data:pr}]=await Promise.all([
       ap.category_id?sb.from('auction_categories').select('*').eq('id',ap.category_id).maybeSingle():Promise.resolve({data:null}),
       sb.from('player_registrations').select('player_id').eq('id',ap.player_registration_id).maybeSingle()
     ]);
     if(cat) CAT=cat;
     if(pr?.player_id){
       const {data:pl}=await sb.from('players').select('full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url').eq('id',pr.player_id).maybeSingle();
       PLAYER=pl;
     }
   }
 } else if(S?.current_player_id){
   const {data:r}=await sb.from('player_registrations').select('auction_category_id,players(full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url)').eq('tournament_id',T.id).eq('player_id',S.current_player_id).eq('status','approved').maybeSingle();
   PLAYER=r?.players||null;CAT=r?.auction_category_id?await getCat(r.auction_category_id):null;
 }
 await loadAuctionOverview();
 render()}
async function loadAuctionOverview(){
 const [teamsRes,walletsRes,squadRes]=await Promise.all([
  sb.from('teams').select('id,name,captain_id,captain:captain_id(full_name,display_name)').eq('tournament_id',T.id).order('name'),
  sb.from('auction_team_wallets').select('team_id,remaining_purse').eq('tournament_id',T.id),
  sb.from('auction_squad').select('team_id,player_id,purchase_price').eq('tournament_id',T.id)
 ]);
 if(teamsRes.error||walletsRes.error||squadRes.error){OVERVIEW=[];return}
 const teamRows=teamsRes.data||[],walletRows=walletsRes.data||[],squadRows=squadRes.data||[];
 const playerIds=[...new Set(squadRows.map(x=>x.player_id).filter(Boolean))];
 let playerMap={};
 if(playerIds.length){const {data}=await sb.from('players').select('id,full_name,display_name,profile_photo_url,playing_role').in('id',playerIds);for(const p of data||[])playerMap[p.id]=p}
 OVERVIEW=teamRows.map(t=>({id:t.id,name:t.name,captain:t.captain?.display_name||t.captain?.full_name||'Captain not assigned',purse:walletRows.find(w=>w.team_id===t.id)?.remaining_purse,players:squadRows.filter(x=>x.team_id===t.id).map(x=>({player_id:x.player_id,name:playerMap[x.player_id]?.display_name||playerMap[x.player_id]?.full_name||'Player',price:x.purchase_price,photo:playerMap[x.player_id]?.profile_photo_url||'',role:playerMap[x.player_id]?.playing_role||'Player'})).sort((a,b)=>a.name.localeCompare(b.name))}));
}
async function getCat(id){const {data}=await sb.from('auction_categories').select('*').eq('id',id).single();return data}
function render(){captainNav();if(CAPVIEW==='registered'){appx.innerHTML='<div class="card"><h1>👥 Registered Players</h1><p class="muted">All approved players and available stats.</p></div>'+allRegisteredPlayersSection();return}if(CAPVIEW==='teams'){appx.innerHTML='<div class="card"><h1>🏆 Teams & Results</h1><p class="muted">View team rosters and player details.</p></div>'+captainTeamsSection();return}if(!S){appx.innerHTML='<div class="card"><h1>🏏 Auction is not started yet</h1><p class="muted">You can review all approved registered players and their available stats while waiting.</p></div>'+allRegisteredPlayersSection();return}if(S.status==='completed'){appx.innerHTML='<div class="card"><h1>🏆 Auction Completed</h1><p>Thank you, '+esc(ME.display_name||'Captain')+'. View all team rosters in Teams & Results.</p></div>'+captainTeamsSection();return}const min=MINIMUM_BID,inc=Number(A?.bid_increment||0)||10;const next=S.leading_team_id?Number(S.current_bid)+inc:min;appx.innerHTML=`<div class="row between"><div><h1 style="font-size:32px">${esc(T.name)}</h1><p class="muted">Captain: ${esc(ME.display_name||'')} · ${esc(TEAM.name)}</p></div><button class="btn secondary" onclick="logout()">Logout</button></div><div class="live section">
 <div class="pill">${esc(CAT?.name||'Category')}</div>
 <div class="player-profile" style="margin-top:14px">
  <img src="${esc(PLAYER?.profile_photo_url||'')} " class="player-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">
  <div class="player-photo placeholder" style="display:${PLAYER?.profile_photo_url?'none':'grid'}">🏏</div>
  <div class="player-info">
   <h2 style="font-size:34px;margin:0 0 5px">${esc(PLAYER?.display_name||PLAYER?.full_name||'Waiting for player')}</h2>
   <div class="role-badge">${esc((PLAYER?.playing_role||'').replace('_',' ')||'Player')}</div>
   <div class="muted-light">${esc(PLAYER?.batting_style||'')} ${PLAYER?.bowling_style?' · '+esc(PLAYER.bowling_style):''}</div>
  </div>
 </div>
 <div class="stats-grid">
  <div><b>${PLAYER?.cricheroes_matches??'—'}</b><span>Matches</span></div>
  <div><b>${PLAYER?.cricheroes_runs??'—'}</b><span>Runs</span></div>
  <div><b>${PLAYER?.cricheroes_wickets??'—'}</b><span>Wickets</span></div>
  <div><b>${PLAYER?.cricheroes_strike_rate??'—'}</b><span>SR</span></div>
  <div><b>${PLAYER?.cricheroes_economy??'—'}</b><span>Economy</span></div>
 </div>
 ${PLAYER?.cricheroes_profile_url?`<a target="_blank" rel="noopener" href="${esc(PLAYER.cricheroes_profile_url)}" class="profile-link">View CricHeroes Profile ↗</a>`:''}
 <div style="margin-top:12px">Minimum ${money(min)}</div>
 <div class="bid">${money(S.leading_team_id?S.current_bid:min)}</div>
 <div>${S.leading_team_id?`Leading team: ${esc(S.leading_team_id===TEAM.id?TEAM.name:'Another team')}`:'No bid yet'}</div>
</div><div class="teambox section ${S.leading_team_id===TEAM.id?'leading':''}"><div class="row between"><h2>${esc(TEAM.name)}</h2><span class="pill">Remaining Purse: ${money(WAL?.remaining_purse)}</span></div><label>Your Bid</label><input id="myBid" class="bid-input" type="number" min="${next}" value="${next}"><button class="btn big" onclick="bid()">🔨 PLACE BID</button><p class="muted">Your bid will be visible to the auction admin and all other captains immediately.</p></div><section class="card auction-overview"><div class="row between"><div><h2>🏏 Auction Dashboard</h2><p class="muted">Other teams’ remaining purse and purchased players</p></div><button class="btn secondary" onclick="loadAuctionOverview().then(render)">Refresh</button></div><div class="grid section">${OVERVIEW.map(t=>`<div class="overview-team"><div class="row between"><h3>${esc(t.name)}</h3><span class="pill">${t.players.length} bought</span></div><div class="mini">Captain: ${esc(t.captain)}</div><div class="purse">Remaining: ${money(t.purse)}</div>${t.players.length?`<ul class="roster-list">${t.players.map(p=>`<li>${esc(p.name)} <strong>(${money(p.price)})</strong></li>`).join('')}</ul>`:'<div class="roster-empty">No players purchased yet</div>'}</div>`).join('')}</div></section>${remainingPlayersSection()}${allRegisteredPlayersSection()}`}
async function bid(){const val=Number(document.getElementById('myBid').value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:TEAM.id,p_amount:val,p_source:'captain'});if(error)return alert(error.message);await refresh()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('captain-'+T.id).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_squad',filter:'tournament_id=eq.'+T.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_players',filter:'tournament_id=eq.'+T.id},async()=>{await loadCaptainPlayerLists();await refresh()}).on('postgres_changes',{event:'*',schema:'public',table:'player_registrations',filter:'tournament_id=eq.'+T.id},async()=>{await loadCaptainPlayerLists();await refresh()}).subscribe()}
load();
</script></body></html>
