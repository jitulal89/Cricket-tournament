<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Live Auction</title><link rel="stylesheet" href="styles.css"><style>.live{background:#111827;color:#fff;border-radius:18px;padding:20px}.bid{font-size:42px;font-weight:900}.teambox{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:18px}.leading{border-color:#16a34a;background:#f0fdf4}.bid-input{font-size:26px;text-align:center;font-weight:800}.big{font-size:20px;padding:16px;width:100%}.live-status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:900}.waiting{padding:28px;text-align:center;border:2px dashed #d0d5dd;border-radius:16px;color:#667085}</style></head>
<body><header class="top"><div class="brand">🏏 Captain Live Auction</div><nav id="nav" class="nav"></nav></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=21"></script><script>
let T,ME,S,TEAM,PLAYER,CAT,WAL,A,channel;const appx=document.getElementById('app');
async function load(){try{const {data:{user}}=await sb.auth.getUser();if(!user){location.href='captain-login.html?slug='+encodeURIComponent(qs('slug'));return}T=await getTournament(qs('slug'));const {data:p,error}=await sb.rpc('claim_captain_access',{p_tournament:T.id});if(error)throw error;ME=p;if(!ME?.team_id)throw new Error('Your captain login is not assigned to a team yet.');const {data:tm,error:te}=await sb.from('teams').select('*').eq('id',ME.team_id).single();if(te)throw te;TEAM=tm;await refresh();subscribe()}catch(e){appx.innerHTML=msg(e.message,'err')}}
async function refresh(){const [s,w,a]=await Promise.all([sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle(),sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id).eq('team_id',TEAM.id).maybeSingle(),sb.from('auction_settings').select('bid_increment').eq('tournament_id',T.id).maybeSingle()]);if(s.error)throw s.error;S=s.data;WAL=w.data;A=a.data;PLAYER=null;CAT=null;if(S?.current_auction_player_id){const {data:ap,error:ae}=await sb.from('auction_players').select('id,category_id,player_registration_id,auction_status').eq('id',S.current_auction_player_id).single();if(ae)throw ae;const {data:r,error:re}=await sb.from('player_registrations').select('id,player_id,auction_category_id').eq('id',ap.player_registration_id).single();if(re)throw re;if(r?.player_id){const {data:p,error:pe}=await sb.from('players').select('id,full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_profile_url,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy').eq('id',r.player_id).single();if(pe)throw pe;PLAYER=p}CAT=r?await getCat(r.auction_category_id):null}render()}
async function getCat(id){if(!id)return null;const {data,error}=await sb.from('auction_categories').select('*').eq('id',id).single();if(error)throw error;return data}
function initials(){return String(PLAYER?.display_name||PLAYER?.full_name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function placeholder(v,label){return v===null||v===undefined||v===''?`<span class="profile-placeholder">${label}</span>`:esc(v)}
function profileCard(){if(!PLAYER)return '<div class="waiting"><strong>Waiting for the admin to put the next player up for auction.</strong><div class="muted" style="margin-top:6px">The page will update automatically when the auction changes.</div></div>';const photo=PLAYER.profile_photo_url?`<img src="${esc(PLAYER.profile_photo_url)}" alt="Player photo">`:esc(initials());return `<div class="auction-player-card"><div class="player-avatar">${photo}</div><div><div class="mini">CURRENT PLAYER · ${esc(CAT?.name||'Category')}</div><div class="player-name">${esc(PLAYER.display_name||PLAYER.full_name||'Player')}</div><div class="player-meta"><span class="role-badge">${placeholder(PLAYER.playing_role,'Role not provided')}</span><span class="role-badge">🏏 Batting: ${placeholder(PLAYER.batting_style,'Not provided')}</span><span class="role-badge">🎯 Bowling: ${placeholder(PLAYER.bowling_style,'Not provided')}</span></div><div class="stat-grid"><div class="stat"><strong>${placeholder(PLAYER.cricheroes_matches,'—')}</strong><span>Matches</span></div><div class="stat"><strong>${placeholder(PLAYER.cricheroes_runs,'—')}</strong><span>Runs</span></div><div class="stat"><strong>${placeholder(PLAYER.cricheroes_wickets,'—')}</strong><span>Wickets</span></div><div class="stat"><strong>${placeholder(PLAYER.cricheroes_strike_rate,'—')}</strong><span>Strike Rate</span></div><div class="stat"><strong>${placeholder(PLAYER.cricheroes_economy,'—')}</strong><span>Economy</span></div></div>${PLAYER.cricheroes_profile_url?`<a class="btn secondary section" target="_blank" rel="noopener" href="${esc(PLAYER.cricheroes_profile_url)}">View CricHeroes Profile ↗</a>`:''}</div></div>`}
function render(){if(!S){appx.innerHTML='<div class="card">Auction has not started yet. Please wait for the admin.</div>';return}if(S.status==='completed'){appx.innerHTML='<div class="card"><h1>🏆 Auction Completed</h1><p>Thank you, '+esc(ME.display_name||'Captain')+'.</p></div>';return}const min=Number(CAT?.minimum_bid||0),inc=Number(A?.bid_increment||0)||10;const next=S.leading_team_id?Number(S.current_bid)+inc:Number(S.current_bid||min);appx.innerHTML=`<div class="row between"><div><h1 style="font-size:32px">${esc(T.name)}</h1><p class="muted">Captain: ${esc(ME.display_name||'')} · ${esc(TEAM.name)} · <span class="live-status">${esc(String(S.status||'waiting').toUpperCase())}</span></p></div><button class="btn secondary" onclick="logout()">Logout</button></div><div class="section">${profileCard()}</div><div class="live section"><div class="row between"><div><div class="pill">${esc(CAT?.name||'Category')}</div><div style="margin-top:8px">Minimum bid ${money(min)}</div></div><div style="text-align:right"><div class="mini" style="color:#cbd5e1">CURRENT BID</div><div class="bid">${money(S.current_bid)}</div></div></div><div style="margin-top:8px">${S.leading_team_id?`Leading team: <strong>${esc(S.leading_team_id===TEAM.id?TEAM.name:'Another team')}</strong>`:'No bid yet'}</div></div><div class="teambox section ${S.leading_team_id===TEAM.id?'leading':''}"><div class="row between"><h2>${esc(TEAM.name)}</h2><span class="pill">Remaining Purse: ${money(WAL?.remaining_purse)}</span></div><label>Your Bid</label><input id="myBid" class="bid-input" type="number" min="${next}" value="${next}"><button class="btn big" onclick="bid()">🔨 PLACE BID</button><p class="muted">Your bid is visible to the auction admin and other captains immediately.</p></div>`}
async function bid(){const val=Number(document.getElementById('myBid').value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:TEAM.id,p_amount:val,p_source:'captain'});if(error)return alert(error.message);await refresh()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('captain-auction-'+T.id+'-'+(qs('session')||'default')).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},()=>refresh()).subscribe()}
load();</script></body></html>
