<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Login</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">🏏 Captain Auction Login</div><nav id="nav" class="nav"></nav></header><main id="app"><div class="card" style="max-width:520px;margin:auto"><h1 style="font-size:32px">Captain Login</h1><p class="muted">Login to your team auction screen. New captains can create their account here.</p><div id="msg"></div><label>Tournament</label><input id="slug" placeholder="tournament-slug" value=""><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><label>Captain Name</label><input id="name" placeholder="Only required for new account"><div class="row"><button class="btn" onclick="login()">Login</button><button class="btn secondary" onclick="signup()">Create Captain Account</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const m=document.getElementById('msg'); document.getElementById('slug').value=qs('slug');
async function login(){m.innerHTML='';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return m.innerHTML=msg(error.message,'err');const t=await getTournament(slug.value.trim());const {data:p}=await sb.from('captain_profiles').select('*').eq('user_id',(await sb.auth.getUser()).data.user.id).eq('tournament_id',t.id).maybeSingle();if(!p){await sb.auth.signOut();return m.innerHTML=msg('No captain account is registered for this tournament.','err')}location.href='captain-auction.html?slug='+encodeURIComponent(t.slug)}
async function signup(){m.innerHTML='';if(!slug.value.trim()||!email.value.trim()||!password.value||!name.value.trim())return m.innerHTML=msg('Tournament, email, password and captain name are required.','err');const t=await getTournament(slug.value.trim());const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{tournament_id:t.id,display_name:name.value.trim()}}});if(error)return m.innerHTML=msg(error.message,'err');if(!data.user)return m.innerHTML=msg('Account created. Please verify your email, then login.');if(data.session){await sb.auth.signOut()}m.innerHTML=msg('Captain account created. Please verify your email if required, then login. Ask the tournament admin to assign your account to your team.');}
</script></body></html>
