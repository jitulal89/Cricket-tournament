<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Login</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="brand">🏏 Captain Auction Login</div><nav id="nav" class="nav"></nav></header>
<main id="app"><div class="card" style="max-width:520px;margin:auto"><h1 style="font-size:32px">Captain Login</h1><p class="muted">Enter the email that the tournament admin registered for your captain account. We will send you a secure one-time login link.</p><div id="msg"></div><label>Tournament</label><input id="slug" placeholder="tournament-slug"><label>Captain Email</label><input id="email" type="email" autocomplete="email" placeholder="captain@example.com"><button class="btn big section" onclick="sendLink()">✉️ Send Login Link</button><p class="muted">No password is required. The login link is valid for this sign-in.</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const m=document.getElementById('msg');slug.value=qs('slug');
async function sendLink(){m.innerHTML='';const s=slug.value.trim(),e=email.value.trim().toLowerCase();if(!s||!e)return m.innerHTML=msg('Tournament and captain email are required.','err');let t;try{t=await getTournament(s)}catch(x){return m.innerHTML=msg(x.message,'err')}const redirect=location.origin+location.pathname.replace(/[^/]*$/,'')+'captain-auction.html?slug='+encodeURIComponent(t.slug);const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true,emailRedirectTo:redirect}});if(error)return m.innerHTML=msg(error.message,'err');m.innerHTML=msg('Login link sent. Check the captain email and open the link on this device.');}
</script></body></html>
