<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Login</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="brand">🏏 Captain Auction Login</div><nav id="nav" class="nav"></nav></header>
<main id="app"><div class="card" style="max-width:560px;margin:auto"><h1 style="font-size:32px">Captain Login</h1><p class="muted">Use the email and password provided by the tournament admin.</p><div id="msg"></div>
<label>Tournament Name or Slug</label><input id="slug" placeholder="Test_Tournament or test-tournament">
<label>Captain Email</label><input id="email" type="email" autocomplete="username" placeholder="captain@example.com">
<label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password">
<div class="card section" style="background:#f8fafc"><strong>Same-device testing</strong><p class="muted">Choose a separate session for each captain. Each session keeps its own login on the same device.</p><label>Testing Session</label><select id="session"><option value="default">Normal / Production</option><option value="team-a">Team A</option><option value="team-b">Team B</option><option value="team-c">Team C</option><option value="team-d">Team D</option><option value="team-e">Team E</option></select></div>
<button class="btn big section" onclick="login()">🔐 Login</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=16"></script><script>
const initialSession=qs('session')||'default'; document.getElementById('session').value=initialSession;
async function login(){const m=document.getElementById('msg');m.innerHTML='';const s=document.getElementById('slug').value.trim(),e=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value,session=document.getElementById('session').value;if(!s||!e||!pw)return m.innerHTML=msg('Tournament, email and password are required.','err');if(session!==initialSession){location.href='captain-login.html?session='+encodeURIComponent(session)+'&slug='+encodeURIComponent(s);return}try{const t=await getTournament(s);const {data,error}=await sb.auth.signInWithPassword({email:e,password:pw});if(error)throw error;const {data:p,error:pe}=await sb.rpc('claim_captain_access',{p_tournament:t.id});if(pe)throw pe;if(!p?.team_id)throw new Error('Captain account is not assigned to a team yet.');location.href='captain-auction.html?slug='+encodeURIComponent(t.slug)+'&session='+encodeURIComponent(session)}catch(x){await sb.auth.signOut();m.innerHTML=msg(x.message,'err')}}
</script></body></html>
