<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Results</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=21"></script><script>async function load(){await setNav();try{const t=await getTournament(qs("slug"));const {data,error}=await sb.from("matches").select("*").eq("tournament_id",t.id).not("status","eq","scheduled").order("scheduled_at",{ascending:false});if(error)throw error;app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Results</h1><div class="grid section">${(data||[]).map(x=>`<div class="card"><h3>${esc(x.round||"Match")}</h3><p>${esc(x.home_team_id||"TBD")} vs ${esc(x.away_team_id||"TBD")}</p><p><strong>${esc(x.home_score||"—")}</strong> : <strong>${esc(x.away_score||"—")}</strong></p><span class="pill">${esc(x.status||"completed")}</span></div>`).join("")||`<div class="card empty">Results will appear here.</div>`}</div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();</script></body></html>
