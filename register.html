<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Registration</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Player Registration</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=21"></script><script>
async function load(){await setNav();try{const t=await getTournament(qs("slug"));if(t.status!=="registration_open")throw new Error("Registration is currently closed.");app.innerHTML=`<div class="card" style="max-width:720px;margin:auto"><div class="row">${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:"<div class='logo' style='display:grid;place-items:center;font-size:30px'>🏏</div>"}<div><h2>${esc(t.name)}</h2><p class="muted">Player Registration</p></div></div><div id="m"></div><label>Full name *</label><input id="fullName"><label>Display name</label><input id="displayName"><label>Phone *</label><input id="phone" type="tel"><label>Email</label><input id="email" type="email"><label>Date of birth</label><input id="dob" type="date"><label>Batting style</label><select id="bat"><option value="">Select</option><option value="right_hand">Right hand</option><option value="left_hand">Left hand</option></select><label>Bowling style</label><select id="bowl"><option value="">Select</option><option value="right_arm_fast">Right arm fast</option><option value="right_arm_medium">Right arm medium</option><option value="right_arm_spin">Right arm spin</option><option value="left_arm_fast">Left arm fast</option><option value="left_arm_medium">Left arm medium</option><option value="left_arm_spin">Left arm spin</option><option value="none">Does not bowl</option></select><label>Playing role</label><select id="role"><option value="">Select</option><option value="batsman">Batsman</option><option value="bowler">Bowler</option><option value="all_rounder">All-rounder</option><option value="wicket_keeper">Wicket keeper</option></select><label>CricHeroes profile URL</label><input id="ch" type="url" placeholder="https://cricheroes.com/..."><button class="btn" onclick="submitReg('${encodeURIComponent(t.slug)}','${t.id}')">Submit Registration</button></div>`}catch(e){app.innerHTML=msg(e.message,"err")}}
async function submitReg(slug,tournamentId){const m=document.getElementById("m");if(!fullName.value.trim()||!phone.value.trim()){m.innerHTML=msg("Name and phone are required.","err");return}const {data:p,error:pe}=await sb.from("players").insert({full_name:fullName.value.trim(),display_name:displayName.value.trim()||null,phone:phone.value.trim(),email:email.value.trim()||null,date_of_birth:dob.value||null,batting_style:bat.value||null,bowling_style:bowl.value||null,playing_role:role.value||null,cricheroes_profile_url:ch.value.trim()||null}).select().single();if(pe){m.innerHTML=msg(pe.message,"err");return}const {error:re}=await sb.from("player_registrations").insert({tournament_id:tournamentId,player_id:p.id,status:"pending"});if(re){m.innerHTML=msg(re.message,"err");return}app.innerHTML=`<div class="card" style="max-width:600px;margin:40px auto;text-align:center"><div style="font-size:54px">✅</div><h2>Registration submitted!</h2><p class="muted">Your registration has been received and is awaiting administrator approval.</p><a class="btn" href="tournament.html?slug=${slug}">Back to Tournament</a></div>`}load();
</script></body></html>
