<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Teams</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=16"></script><script>async function load(){await setNav();try{const t=await getTournament(qs("slug"));const {data,error}=await sb.from("teams").select("id,name,captain_id,players:captain_id(full_name,display_name)").eq("tournament_id",t.id).order("name");if(error)throw error;app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Teams</h1><div class="grid section">${(data||[]).map(x=>`<div class="card"><h2>${esc(x.name)}</h2><p><strong>Captain:</strong> ${esc(x.players?.display_name||x.players?.full_name||"To be selected")}</p></div>`).join("")||`<div class="card empty">Teams will appear here.</div>`}</div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();</script></body></html>
