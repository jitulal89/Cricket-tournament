<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Stats</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Player Stats</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=14"></script><script>async function load(){await setNav();try{const t=await getTournament(qs("slug"));const {data,error}=await sb.from("player_match_statistics").select("*").eq("tournament_id",t.id);if(error)throw error;app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Player Stats</h1><div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Matches</th><th>Runs</th><th>Wickets</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.player_id)}</td><td>${esc(x.matches_played||0)}</td><td>${esc(x.runs||0)}</td><td>${esc(x.wickets||0)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Player stats will appear here.</td></tr>`}</tbody></table></div></div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();</script></body></html>
