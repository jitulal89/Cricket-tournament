<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auction Results</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Auction Results</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>async function load(){await setNav();try{const t=await getTournament(qs('slug'));const [r,p,tm]=await Promise.all([sb.from('auction_results').select('*').eq('tournament_id',t.id).order('created_at',{ascending:false}),sb.from('players').select('id,full_name,display_name'),sb.from('teams').select('id,name')]);if(r.error)throw r.error;const pm=Object.fromEntries((p.data||[]).map(x=>[x.id,x.display_name||x.full_name])),tmn=Object.fromEntries((tm.data||[]).map(x=>[x.id,x.name]));app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Auction Results</h1><div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th>Final Bid</th><th>Status</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(pm[x.player_id]||x.player_id)}</td><td>${esc(tmn[x.team_id]||'—')}</td><td>${money(x.final_bid)}</td><td><span class="pill ${x.status==='sold'?'green':'red'}">${esc(x.status||'sold')}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Auction results will appear here.</td></tr>'}</tbody></table></div></div>`}catch(e){app.innerHTML=msg(e.message,'err')}}load();</script></body></html>
