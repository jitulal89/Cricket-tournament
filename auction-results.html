<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auction Results</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Auction Results</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=14"></script><script>
async function load(){await setNav();try{const t=await getTournament(qs('slug'));const {data:r,error}=await sb.from('auction_results').select('id,auction_event_id,auction_player_id,result,team_id,final_price,created_at').order('created_at',{ascending:false});if(error)throw error;const rows=(r||[]).filter(x=>x.auction_event_id);const apIds=[...new Set(rows.map(x=>x.auction_player_id).filter(Boolean))],teamIds=[...new Set(rows.map(x=>x.team_id).filter(Boolean))];let aps=[],trs=[];if(apIds.length){const z=await sb.from('auction_players').select('id,player_registration_id').in('id',apIds);if(z.error)throw z.error;aps=z.data||[]}if(teamIds.length){const z=await sb.from('teams').select('id,name').in('id',teamIds);if(z.error)throw z.error;trs=z.data||[]}const regIds=[...new Set(aps.map(x=>x.player_registration_id).filter(Boolean))];let regs=[];if(regIds.length){const z=await sb.from('player_registrations').select('id,player_id,tournament_id').in('id',regIds);if(z.error)throw z.error;regs=(z.data||[]).filter(x=>x.tournament_id===t.id)}const pids=[...new Set(regs.map(x=>x.player_id).filter(Boolean))];let players=[];if(pids.length){const z=await sb.from('players').select('id,full_name,display_name').in('id',pids);if(z.error)throw z.error;players=z.data||[]}const am=Object.fromEntries(aps.map(x=>[x.id,x.player_registration_id])),rm=Object.fromEntries(regs.map(x=>[x.id,x.player_id])),pm=Object.fromEntries(players.map(x=>[x.id,x.display_name||x.full_name])),tm=Object.fromEntries(trs.map(x=>[x.id,x.name]));const out=rows.filter(x=>rm[am[x.auction_player_id]]).map(x=>`<tr><td>${esc(pm[rm[am[x.auction_player_id]]]||'Player')}</td><td>${esc(tm[x.team_id]||'—')}</td><td>${money(x.final_price)}</td><td><span class="pill ${x.result==='sold'?'green':'red'}">${esc(x.result||'')}</span></td></tr>`).join('');app.innerHTML=`<h1 style="font-size:38px">${esc(t.name)} — Auction Results</h1><div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th>Final Bid</th><th>Status</th></tr></thead><tbody>${out||'<tr><td colspan="4" class="empty">Auction results will appear here.</td></tr>'}</tbody></table></div></div>`}catch(e){app.innerHTML=msg(e.message,'err')}}load();
</script></body></html>
