<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Accounts</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">🏏 Captain Accounts</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let T,TEAMS=[];async function load(){if(!(await requireAdmin()))return;await setNav();try{T=await getTournament(qs('slug'));const [p,t]=await Promise.all([sb.from('captain_profiles').select('*').eq('tournament_id',T.id).order('created_at'),sb.from('teams').select('id,name,captain_id').eq('tournament_id',T.id).order('name')]);if(p.error)throw p.error;if(t.error)throw t.error;TEAMS=t.data||[];render(p.data||[])}catch(e){app.innerHTML=msg(e.message,'err')}}function render(rows){app.innerHTML=`<div class="row between"><div><h1 style="font-size:34px">Captain Accounts</h1><p class="muted">${esc(T.name)}</p></div><a class="btn secondary" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">← Pre-Auction</a></div><div class="notice section">Captains create their own account from the Captain Login page. Assign each captain to the correct team here.</div><div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Team</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><strong>${esc(p.display_name||'Captain')}</strong></td><td>${esc(p.email)}</td><td><select id="team_${p.user_id}"><option value="">Not assigned</option>${TEAMS.map(t=>`<option value="${t.id}" ${p.team_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></td><td><button class="btn" onclick="assign('${p.user_id}')">Save</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No captain accounts yet.</td></tr>'}</tbody></table></div></div>`}async function assign(uid){const team=document.getElementById('team_'+uid).value||null;const {error}=await sb.from('captain_profiles').update({team_id:team,updated_at:new Date().toISOString()}).eq('user_id',uid);if(error)return alert(error.message);alert('Captain assignment saved.');load()}load();
</script></body></html>
