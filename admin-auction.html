<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Auction</title><link rel="stylesheet" href="styles.css"><style>
.auction-hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:18px;padding:24px;margin:18px 0}.current-bid{font-size:clamp(42px,9vw,78px);font-weight:900;margin:4px 0}.team-card{border:2px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff}.team-card.leading{border-color:#16a34a;background:#f0fdf4}.team-card .purse{font-size:22px;font-weight:800}.bid-input{font-size:24px;text-align:center;font-weight:800}.bigbtn{font-size:18px;padding:14px 20px}.category-order{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin:7px 0;background:#fff}.category-order .grow{flex:1}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px}.offline{background:#fef2f2;color:#991b1b}.admin-fallback{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px}.winner{font-size:24px;font-weight:800}.mini{font-size:12px;color:#667085}.queue-item{padding:8px 10px;border-bottom:1px solid #eee}.queue-item.active{background:#eff6ff;font-weight:800}
</style></head><body><header class="top"><div class="brand">🔨 Live Auction — Admin</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let T,A,S,CATS=[],TEAMS=[],PLAYERS=[],CATMAP={},channel=null;
const $=id=>document.getElementById(id);
async function loadBase(){
 if(!(await requireAdmin()))return; await setNav();
 try{
  T=await getTournament(qs('slug'));
  const [a,c,tm,r]=await Promise.all([
   sb.from('auction_settings').select('*').eq('tournament_id',T.id).maybeSingle(),
   sb.from('auction_categories').select('id,name,minimum_bid,auction_order').eq('tournament_id',T.id).order('auction_order',{ascending:true,nullsFirst:false}).order('name'),
   sb.from('teams').select('id,name,captain_id').eq('tournament_id',T.id).order('name'),
   sb.from('player_registrations').select('id,player_id,auction_category_id,is_captain,status').eq('tournament_id',T.id).eq('status','approved')
  ]);
  for(const x of [a,c,tm,r])if(x.error)throw x.error;
  A=a.data;CATS=c.data||[];TEAMS=tm.data||[]; const caps=new Set(TEAMS.map(x=>x.captain_id).filter(Boolean));
  const regs=r.data||[]; const pids=[...new Set(regs.map(x=>x.player_id).filter(Boolean))]; let pmap={};
  if(pids.length){const pr=await sb.from('players').select('id,full_name,display_name,playing_role').in('id',pids);if(pr.error)throw pr.error;(pr.data||[]).forEach(p=>pmap[p.id]=p);}
  PLAYERS=regs.filter(x=>!caps.has(x.player_id)).map(x=>({...x,players:pmap[x.player_id]||null}));
  CATMAP=Object.fromEntries(CATS.map(x=>[x.id,x]));
  const {data:s,error:se}=await sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle(); if(se)throw se; S=s;
  render(); subscribe();
 }catch(e){$('app').innerHTML=msg(e.message,'err')}
}
function player(id){const x=PLAYERS.find(p=>p.player_id===id);return x?.players||null}
function currentCategory(){return S?.current_player_id ? CATMAP[PLAYERS.find(p=>p.player_id===S.current_player_id)?.auction_category_id] : null}
function queueRemaining(catId){if(!S)return [];const arr=S.category_queues?.[catId]||[];return arr.filter(id=>id!==S.current_player_id)}
function render(){
 if(!A){$('app').innerHTML='<div class="card">Auction settings not found.</div>';return}
 if(!S){
  $('app').innerHTML=`<div class="card"><h2>Auction is ready to start</h2><p class="muted">Choose the category order below. Players will be shuffled automatically inside each category when you start.</p>${categoryOrderEditor()}<button class="btn success bigbtn" onclick="startAuction()">▶ Start Auction</button></div>`;return;
 }
 const cp=player(S.current_player_id),cat=currentCategory();
 if(S.status==='completed'){$('app').innerHTML=`<div class="card"><h1>🏆 Auction Completed</h1><p>${esc(T.name)}</p><a class="btn" href="auction-results.html?slug=${encodeURIComponent(T.slug)}">View Results</a></div>`;return}
 $('app').innerHTML=`
 <div class="row between"><div><h1 style="font-size:36px">Live Auction</h1><p class="muted">${esc(T.name)} · <span class="status-dot"></span>${esc(S.status.toUpperCase())}</p></div><div class="row"><a class="btn secondary" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">Setup</a><button class="btn secondary" onclick="location.reload()">Refresh</button></div></div>
 <div class="auction-hero">
  <div class="pill">CATEGORY ${esc(cat?.name||'—')}</div>
  <div class="mini" style="color:#cbd5e1;margin-top:8px">CURRENT PLAYER</div>
  <h2 style="font-size:clamp(30px,7vw,56px);margin:4px 0">${esc(cp?.display_name||cp?.full_name||'No player')}</h2>
  <div>${esc(cp?.playing_role||'')} · Minimum bid ${money(cat?.minimum_bid)}</div>
  <div class="current-bid">${money(S.current_bid)}</div>
  <div>${S.leading_team_id?`Leading: <strong>${esc(TEAMS.find(t=>t.id===S.leading_team_id)?.name||'Team')}</strong>`:'No bid yet'}</div>
 </div>
 <div class="card section"><h2>Team Bidding</h2><p class="muted">Captains bid from their own devices. If a captain has a problem, use the admin fallback below.</p><div class="grid">${TEAMS.map(team=>teamCard(team)).join('')}</div></div>
 <div class="card section"><div class="row between"><div><h2>Admin Controls</h2><p class="muted">Use only when required or when the auction host is managing the bid.</p></div><span class="pill">Admin Override</span></div><div class="grid"><div><label>Team</label><select id="adminTeam">${TEAMS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div><label>Bid Amount</label><input id="adminBid" class="bid-input" type="number" min="0" value="${nextBid()}"></div></div><div class="row"><button class="btn bigbtn" onclick="adminBid()">🔨 Enter Bid for Captain</button><button class="btn success bigbtn" onclick="finishPlayer('sold')">✓ Sell Player</button><button class="btn danger bigbtn" onclick="finishPlayer('unsold')">✕ Unsold</button></div></div>
 <div class="card section"><h2>Category Order</h2>${categoryOrderEditor()}</div>
 <div class="card section"><h2>Remaining in Current Category</h2>${queueRemaining(PLAYERS.find(p=>p.player_id===S.current_player_id)?.auction_category_id).map(id=>{const p=player(id);return `<div class="queue-item">${esc(p?.display_name||p?.full_name||'Player')}</div>`}).join('')||'<div class="empty">No more players in this category.</div>'}</div>`;
}
function nextBid(){const inc=Number(A?.bid_increment)||10;return Number(S?.current_bid||0)+(S?.leading_team_id?inc:0)}
function teamCard(team){return `<div class="team-card ${S.leading_team_id===team.id?'leading':''}"><div class="row between"><strong>${esc(team.name)}</strong>${S.leading_team_id===team.id?'<span class="pill green">LEADING</span>':''}</div><div class="purse" id="purse-${team.id}">Loading…</div><div class="mini">Captain login: ${team.captain_id?'assigned':'not assigned'}</div><div class="row section"><input id="bid-${team.id}" type="number" class="bid-input" min="0" value="${nextBid()}"><button class="btn" onclick="captainFallback('${team.id}')">Bid</button></div></div>`}
function categoryOrderEditor(){return `<div>${CATS.map((c,i)=>`<div class="category-order"><span><strong>${i+1}</strong></span><div class="grow"><strong>${esc(c.name)}</strong><div class="mini">Minimum ${money(c.minimum_bid)}</div></div><button class="btn secondary" onclick="moveCat('${c.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="btn secondary" onclick="moveCat('${c.id}',1)" ${i===CATS.length-1?'disabled':''}>↓</button></div>`).join('')}</div>`}
async function moveCat(id,dir){if(S?.status==='live')return alert('Category order cannot be changed after auction starts.');const i=CATS.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=CATS.length)return;[CATS[i],CATS[j]]=[CATS[j],CATS[i]];for(let k=0;k<CATS.length;k++){const {error}=await sb.from('auction_categories').update({auction_order:k+1}).eq('id',CATS[k].id);if(error)return alert(error.message)}render()}
async function startAuction(){if(!confirm('Start the category-wise auction? Players will be randomly shuffled within each category.'))return;const {data,error}=await sb.rpc('start_live_auction',{p_tournament_id:T.id});if(error)return alert(error.message);const {data:s}=await sb.from('auction_sessions').select('*').eq('id',data).single();S=s;await loadWallets();render();subscribe()}
async function loadWallets(){const {data,error}=await sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id);if(error)return;for(const w of data||[]){const el=$('purse-'+w.team_id);if(el)el.textContent=money(w.remaining_purse)}}
async function captainFallback(teamId){const val=Number($('bid-'+teamId).value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team:teamId,p_amount:val,p_source:'admin'});if(error)return alert(error.message);await refreshSession()}
async function adminBid(){const val=Number($('adminBid').value),team=$('adminTeam').value;if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team:team,p_amount:val,p_source:'admin'});if(error)return alert(error.message);await refreshSession()}
async function finishPlayer(result){if(!confirm(result==='sold'?'Sell this player to the leading team?':'Mark this player unsold?'))return;const {error}=await sb.rpc('finish_current_auction_player',{p_tournament:T.id,p_result:result});if(error)return alert(error.message);await refreshSession()}
async function refreshSession(){const {data,error}=await sb.from('auction_sessions').select('*').eq('tournament_id',T.id).single();if(error)return alert(error.message);S=data;render();await loadWallets()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('auction-'+T.id).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},()=>refreshSession()).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},()=>loadWallets()).on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},()=>refreshSession()).subscribe();loadWallets()}
loadBase();
</script></body></html>
