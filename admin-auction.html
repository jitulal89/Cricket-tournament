<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Auction</title><link rel="stylesheet" href="styles.css"><style>.auction-hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:18px;padding:24px;margin:18px 0}.current-bid{font-size:clamp(42px,9vw,78px);font-weight:900;margin:4px 0}.team-card{border:2px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff}.team-card.leading{border-color:#16a34a;background:#f0fdf4}.team-card .purse{font-size:22px;font-weight:800}.bid-input{font-size:24px;text-align:center;font-weight:800}.bigbtn{font-size:18px;padding:14px 20px}.category-order{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin:7px 0;background:#fff}.category-order .grow{flex:1}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px}.mini{font-size:12px;color:#667085}.queue-item{padding:8px 10px;border-bottom:1px solid #eee}.last-sale{margin:18px 0}.offline{background:#fef2f2;color:#991b1b}.empty{padding:14px;color:#667085}</style></head><body><header class="top"><div class="brand">🔨 Live Auction — Admin</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=16"></script><script>
let T,A,S,CATS=[],TEAMS=[],PLAYERS=[],CATMAP={},CURRENT=null,LAST=null,channel=null;const $=id=>document.getElementById(id);
async function loadBase(){if(!(await requireAdmin()))return;await setNav();try{T=await getTournament(qs('slug'));const [a,c,tm,r,s]=await Promise.all([sb.from('auction_settings').select('*').eq('tournament_id',T.id).maybeSingle(),sb.from('auction_categories').select('id,name,minimum_bid,auction_order').eq('tournament_id',T.id).order('auction_order',{ascending:true,nullsFirst:false}).order('name'),sb.from('teams').select('id,name,captain_id').eq('tournament_id',T.id).order('name'),sb.from('player_registrations').select('id,player_id,auction_category_id,is_captain,status').eq('tournament_id',T.id).eq('status','approved'),sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle()]);for(const x of [a,c,tm,r,s])if(x.error)throw x.error;A=a.data;CATS=c.data||[];TEAMS=tm.data||[];const caps=new Set(TEAMS.map(x=>x.captain_id).filter(Boolean));const regs=r.data||[];const pids=[...new Set(regs.map(x=>x.player_id).filter(Boolean))];let pmap={};if(pids.length){const pr=await sb.from('players').select('id,full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_profile_url,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy').in('id',pids);if(pr.error)throw pr.error;pmap=Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));}PLAYERS=regs.filter(x=>!caps.has(x.player_id)).map(x=>({...x,players:pmap[x.player_id]||null}));CATMAP=Object.fromEntries(CATS.map(x=>[x.id,x]));S=s.data;await loadCurrent();await loadLastSale();render();subscribe()}catch(e){$('app').innerHTML=msg(e.message,'err')}}
async function latestEventId(tid){const {data}=await sb.from('auction_events').select('id').eq('tournament_id',tid).order('created_at',{ascending:false}).limit(1).maybeSingle();return data?.id}
async function loadCurrent(){CURRENT=null;if(!S?.current_auction_player_id)return;const {data:ap,error}=await sb.from('auction_players').select('id,category_id,player_registration_id,auction_status,sold_price,sold_team_id').eq('id',S.current_auction_player_id).single();if(error)throw error;const {data:r,error:re}=await sb.from('player_registrations').select('id,player_id,auction_category_id').eq('id',ap.player_registration_id).single();if(re)throw re;let player=null;if(r?.player_id){const {data:p,error:pe}=await sb.from('players').select('id,full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_profile_url,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy').eq('id',r.player_id).single();if(pe)throw pe;player=p}CURRENT={ap,reg:r,player,cat:CATMAP[r?.auction_category_id]}}
async function loadLastSale(){const {data,error}=await sb.from('auction_results').select('id,auction_player_id,result,team_id,final_price,created_at,auction_players(player_registration_id)').eq('result','sold').order('created_at',{ascending:false}).limit(1).maybeSingle();if(error){LAST=null;return}LAST=data||null;if(LAST?.auction_players?.player_registration_id){const {data:r}=await sb.from('player_registrations').select('player_id').eq('id',LAST.auction_players.player_registration_id).maybeSingle();if(r?.player_id){const {data:p}=await sb.from('players').select('display_name,full_name').eq('id',r.player_id).maybeSingle();LAST.player=p||null}}}
function playerProfile(cp){if(!cp)return '<div class="card">Waiting for the next player.</div>';const p=cp.player;const photo=p?.profile_photo_url?`<img src="${esc(p.profile_photo_url)}" alt="Player photo">`:esc(String(p?.display_name||p?.full_name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase());const ph=(v,l)=>v===null||v===undefined||v===''?`<span class="profile-placeholder">${l}</span>`:esc(v);return `<div class="auction-player-card"><div class="player-avatar">${photo}</div><div><div class="mini">CURRENT PLAYER · ${esc(cp.cat?.name||'Category')}</div><div class="player-name">${esc(p?.display_name||p?.full_name||'Player')}</div><div class="player-meta"><span class="role-badge">${ph(p?.playing_role,'Role not provided')}</span><span class="role-badge">🏏 Batting: ${ph(p?.batting_style,'Not provided')}</span><span class="role-badge">🎯 Bowling: ${ph(p?.bowling_style,'Not provided')}</span></div><div class="stat-grid"><div class="stat"><strong>${ph(p?.cricheroes_matches,'—')}</strong><span>Matches</span></div><div class="stat"><strong>${ph(p?.cricheroes_runs,'—')}</strong><span>Runs</span></div><div class="stat"><strong>${ph(p?.cricheroes_wickets,'—')}</strong><span>Wickets</span></div><div class="stat"><strong>${ph(p?.cricheroes_strike_rate,'—')}</strong><span>Strike Rate</span></div><div class="stat"><strong>${ph(p?.cricheroes_economy,'—')}</strong><span>Economy</span></div></div>${p?.cricheroes_profile_url?`<a class="btn secondary section" target="_blank" rel="noopener" href="${esc(p.cricheroes_profile_url)}">View CricHeroes Profile ↗</a>`:''}</div></div>`}
function currentCategory(){return CURRENT?.cat||null}
function queueRemaining(catId){if(!S)return[];const arr=S.category_queues?.[catId]||[];const current=S.current_auction_player_id;return arr.filter(id=>id!==current).map(id=>player(id)?.display_name||player(id)?.full_name||'Player')}
function player(id){const x=PLAYERS.find(p=>p.player_id===id);return x?.players||null}
function render(){if(!A){$('app').innerHTML='<div class="card">Auction settings not found.</div>';return}if(!S){$('app').innerHTML=`<div class="card"><h2>Auction is ready to start</h2><p class="muted">Choose the category order below. Players will be shuffled automatically inside each category when you start.</p>${categoryOrderEditor()}<button class="btn success bigbtn" onclick="startAuction()">▶ Start Auction</button></div>`;return}if(S.status==='completed'){$('app').innerHTML=`<div class="card"><h1>🏆 Auction Completed</h1><p>${esc(T.name)}</p>${LAST?lastSaleHtml():''}<a class="btn" href="auction-results.html?slug=${encodeURIComponent(T.slug)}">View Results</a></div>`;return}const cp=CURRENT?.player,cat=currentCategory();$('app').innerHTML=`<div class="row between"><div><h1 style="font-size:36px">Live Auction</h1><p class="muted">${esc(T.name)} · <span class="status-dot"></span>${esc(String(S.status).toUpperCase())}</p></div><div class="row"><a class="btn secondary" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">Setup</a><button class="btn secondary" onclick="refreshSession()">Refresh</button></div></div>${playerProfile(CURRENT)}<div class="auction-hero"><div class="row between"><div><div class="pill">CATEGORY ${esc(cat?.name||'—')}</div><div style="margin-top:8px">Minimum bid ${money(cat?.minimum_bid)}</div></div><div style="text-align:right"><div class="mini" style="color:#cbd5e1">CURRENT BID</div><div class="current-bid">${money(S.current_bid)}</div></div></div><div class="winner" style="margin-top:8px">${S.leading_team_id?`Current Team: <strong>${esc(TEAMS.find(t=>t.id===S.leading_team_id)?.name||'Team')}</strong>`:'Current Team: <span style="font-weight:500">No leading team yet</span>'}</div></div>${LAST?lastSaleHtml():''}<div class="card section"><h2>Team Bidding</h2><p class="muted">Captains bid from their own devices. If a captain has a problem, use the admin fallback.</p><div class="grid">${TEAMS.map(team=>teamCard(team)).join('')}</div></div><div class="card section"><div class="row between"><div><h2>Admin Controls</h2><p class="muted">Use only when required or when managing the bid.</p></div><span class="pill">Admin Override</span></div><div class="grid"><div><label>Team</label><select id="adminTeam">${TEAMS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div><label>Bid Amount</label><input id="adminBid" class="bid-input" type="number" min="0" value="${nextBid()}"></div></div><div class="row"><button class="btn bigbtn" onclick="adminBid()">🔨 Enter Bid for Captain</button><button class="btn success bigbtn" onclick="finishPlayer('sold')">✓ Sell Player</button><button class="btn danger bigbtn" onclick="finishPlayer('unsold')">✕ Unsold</button></div></div><div class="card section"><h2>Category Order</h2>${categoryOrderEditor()}</div><div class="card section"><h2>Remaining in Current Category</h2>${queueRemaining(cat?.id).map(n=>`<div class="queue-item">${esc(n)}</div>`).join('')||'<div class="empty">No more players in this category.</div>'}</div>`}
function lastSaleHtml(){const p=LAST?.player;const tm=TEAMS.find(t=>t.id===LAST?.team_id);return `<div class="last-sale"><div class="mini">LAST SOLD PLAYER</div><div class="winner">${esc(p?.display_name||p?.full_name||'Player')}</div><div>Winning Team: <strong>${esc(tm?.name||'Team')}</strong> · Final Bid: <strong>${money(LAST?.final_price)}</strong></div></div>`}
function nextBid(){const inc=Number(A?.bid_increment)||10;return Number(S?.current_bid||0)+(S?.leading_team_id?inc:0)}
function teamCard(team){return `<div class="team-card ${S.leading_team_id===team.id?'leading':''}"><div class="row between"><strong>${esc(team.name)}</strong>${S.leading_team_id===team.id?'<span class="pill green">LEADING</span>':''}</div><div class="purse" id="purse-${team.id}">Loading…</div><div class="mini">Captain login: ${team.captain_id?'assigned':'not assigned'}</div><div class="row section"><input id="bid-${team.id}" type="number" class="bid-input" min="0" value="${nextBid()}"><button class="btn" onclick="captainFallback('${team.id}')">Bid</button></div></div>`}
function categoryOrderEditor(){return `<div>${CATS.map((c,i)=>`<div class="category-order"><span><strong>${i+1}</strong></span><div class="category-order grow"><strong>${esc(c.name)}</strong><div class="mini">Minimum ${money(c.minimum_bid)}</div></div><button class="btn secondary" onclick="moveCat('${c.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="btn secondary" onclick="moveCat('${c.id}',1)" ${i===CATS.length-1?'disabled':''}>↓</button></div>`).join('')}</div>`}
async function moveCat(id,dir){if(S?.status==='live')return alert('Category order cannot be changed after auction starts.');const i=CATS.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=CATS.length)return;[CATS[i],CATS[j]]=[CATS[j],CATS[i]];for(let k=0;k<CATS.length;k++){const {error}=await sb.from('auction_categories').update({auction_order:k+1}).eq('id',CATS[k].id);if(error)return alert(error.message)}render()}
async function startAuction(){if(!confirm('Start the category-wise auction? Players will be randomly shuffled within each category.'))return;const {data,error}=await sb.rpc('start_live_auction',{p_tournament_id:T.id});if(error)return alert(error.message);const {data:s}=await sb.from('auction_sessions').select('*').eq('id',data).single();S=s;await loadCurrent();await loadWallets();await loadLastSale();render();subscribe()}
async function loadWallets(){const {data,error}=await sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id);if(error)return;for(const w of data||[]){const el=$('purse-'+w.team_id);if(el)el.textContent=money(w.remaining_purse)}}
async function captainFallback(teamId){const val=Number($('bid-'+teamId).value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:teamId,p_amount:val,p_source:'admin'});if(error)return alert(error.message);await refreshSession()}
async function adminBid(){const val=Number($('adminBid').value),team=$('adminTeam').value;if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:team,p_amount:val,p_source:'admin'});if(error)return alert(error.message);await refreshSession()}
async function finishPlayer(result){if(!confirm(result==='sold'?'Sell this player to the leading team?':'Mark this player unsold?'))return;const {data,error}=await sb.rpc('finish_current_auction_player',{p_tournament:T.id,p_result:result});if(error)return alert(error.message);await refreshSession()}
async function refreshSession(){const {data,error}=await sb.from('auction_sessions').select('*').eq('tournament_id',T.id).single();if(error)return alert(error.message);S=data;await loadCurrent();await loadLastSale();render();await loadWallets()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('admin-auction-'+T.id).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},()=>refreshSession()).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},()=>refreshSession()).on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},()=>refreshSession()).subscribe();loadWallets()}
loadBase();</script></body></html>
