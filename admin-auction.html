<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Auction</title><link rel="stylesheet" href="styles.css"><style>
.auction-hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:18px;padding:24px;margin:18px 0}.current-bid{font-size:clamp(42px,9vw,78px);font-weight:900;margin:4px 0}.team-card{border:2px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff}.team-card.leading{border-color:#16a34a;background:#f0fdf4}.team-card .purse{font-size:22px;font-weight:800}.bid-input{font-size:24px;text-align:center;font-weight:800}.bigbtn{font-size:18px;padding:14px 20px}.category-order{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin:7px 0;background:#fff}.category-order .grow{flex:1}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px}.offline{background:#fef2f2;color:#991b1b}.admin-fallback{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px}.winner{font-size:24px;font-weight:800}.mini{font-size:12px;color:#667085}.queue-item{padding:8px 10px;border-bottom:1px solid #eee}.queue-item.active{background:#eff6ff;font-weight:800}
</style></head><body><header class="top"><div class="brand">🔨 Live Auction — Admin</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let T,A,S,CATS=[],TEAMS=[],PLAYERS=[],REGISTRATIONS=[],UNSOLD=[],SOLD=[],CATMAP={},channel=null;
const $=id=>document.getElementById(id);
function publicAuctionUrl(){return location.href.split('?')[0].replace(/admin-auction\.html$/,'public-auction.html')+'?slug='+encodeURIComponent(T.slug)}
async function sharePublicAuction(){const url=publicAuctionUrl();if(navigator.share){try{await navigator.share({title:T.name+' – Live Auction',text:'Watch the live cricket auction',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);alert('Public live auction link copied. Share it with everyone.')}catch(e){prompt('Copy this public live auction link:',url)}}
async function loadBase(){
 if(!(await requireAdmin()))return; await setNav();
 try{
  T=await getTournament(qs('slug'));
  const [a,c,tm,r,u,sd]=await Promise.all([
   sb.from('auction_settings').select('*').eq('tournament_id',T.id).maybeSingle(),
   sb.from('auction_categories').select('id,name,minimum_bid,auction_order').eq('tournament_id',T.id).order('auction_order',{ascending:true,nullsFirst:false}).order('name'),
   sb.from('teams').select('id,name,captain_id').eq('tournament_id',T.id).order('name'),
   sb.from('player_registrations').select('id,player_id,auction_category_id,is_captain,status,players(id,full_name,display_name,playing_role,profile_photo_url,batting_style,bowling_style,cricheroes_matches,cricheroes_runs,cricheroes_wickets,cricheroes_strike_rate,cricheroes_economy,cricheroes_profile_url)').eq('tournament_id',T.id).eq('status','approved'),
   sb.from('auction_players').select('id,player_registration_id,category_id,auction_status').eq('tournament_id',T.id).eq('auction_status','unsold'),
   sb.from('auction_players').select('id,player_registration_id,sold_team_id,sold_price,auction_status').eq('tournament_id',T.id).eq('auction_status','sold').order('sold_price',{ascending:false})
  ]);
  for(const x of [a,c,tm,r,u,sd])if(x.error)throw x.error;
  A=a.data;CATS=c.data||[];TEAMS=tm.data||[]; REGISTRATIONS=r.data||[]; const caps=new Set(TEAMS.map(x=>x.captain_id).filter(Boolean)); PLAYERS=REGISTRATIONS.filter(x=>!caps.has(x.player_id)); UNSOLD=(u.data||[]).map(ap=>({...ap,registration:REGISTRATIONS.find(p=>p.id===ap.player_registration_id)})); SOLD=(sd.data||[]).map(ap=>({...ap,registration:REGISTRATIONS.find(p=>p.id===ap.player_registration_id)}));
  CATMAP=Object.fromEntries(CATS.map(x=>[x.id,x]));
  const {data:s,error:se}=await sb.from('auction_sessions').select('*').eq('tournament_id',T.id).maybeSingle(); if(se)throw se; S=s;
  render(); subscribe();
 }catch(e){$('app').innerHTML=msg(e.message,'err')}
}
function player(id){const x=PLAYERS.find(p=>p.player_id===id);return x?.players||null}
function currentCategory(){return S?.current_player_id ? CATMAP[PLAYERS.find(p=>p.player_id===S.current_player_id)?.auction_category_id] : null}
function queueRemaining(catId){if(!S)return [];const arr=S.category_queues?.[catId]||[];return arr.filter(id=>id!==S.current_player_id)}
function render(){
 if(!A){$('app').innerHTML='<div class="card">Auction settings not found.</div>';return}
 if(!S){
  $('app').innerHTML=`<div class="card"><h2>Auction is ready to start</h2><p class="muted">Choose the category order below. Players will be shuffled automatically inside each category when you start.</p>${categoryOrderEditor()}<div class="row section"><button class="btn secondary" onclick="sharePublicAuction()">🔗 Share Spectator Link</button><button class="btn success bigbtn" onclick="startAuction()">▶ Start Auction</button></div></div>${soldPlayersByTeamCard()}`;return;
 }
 const cp=player(S.current_player_id),cat=currentCategory();
 if(S.status==='completed'){$('app').innerHTML=`<div class="card"><h1>🏆 Auction Completed</h1><p>${esc(T.name)}</p><div class="row"><a class="btn" href="auction-results.html?slug=${encodeURIComponent(T.slug)}">View Results</a><button class="btn secondary" onclick="sharePublicAuction()">🔗 Share Public Auction Page</button></div></div>${soldPlayersByTeamCard()}${unsoldPlayersCard()}`;return}
 $('app').innerHTML=`
 <div class="row between"><div><h1 style="font-size:36px">Live Auction</h1><p class="muted">${esc(T.name)} · <span class="status-dot"></span>${esc(S.status.toUpperCase())}</p></div><div class="row"><a class="btn secondary" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">Setup</a><button class="btn" onclick="sharePublicAuction()">🔗 Share Live Auction</button><button class="btn secondary" onclick="location.reload()">Refresh</button></div></div>
 <div class="auction-hero">
  <div class="pill">CATEGORY ${esc(cat?.name||'—')}</div>
  <div class="mini" style="color:#cbd5e1;margin-top:8px">CURRENT PLAYER</div>
  <h2 style="font-size:clamp(30px,7vw,56px);margin:4px 0">${esc(cp?.display_name||cp?.full_name||'No player')}</h2>
  <div class="player-profile" style="margin-top:14px">
   <img src="${esc(cp?.profile_photo_url||'')}" class="player-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" alt="">
   <div class="player-photo placeholder" style="display:${cp?.profile_photo_url?'none':'grid'}">🏏</div>
   <div class="player-info">
    <div class="role-badge">${esc((cp?.playing_role||'').replace('_',' ')||'Player')}</div>
    <div class="muted-light">${esc(cp?.batting_style||'')} ${cp?.bowling_style?' · '+esc(cp.bowling_style):''}</div>
   </div>
  </div>
  <div class="stats-grid">
   <div><b>${cp?.cricheroes_matches??'—'}</b><span>Matches</span></div>
   <div><b>${cp?.cricheroes_runs??'—'}</b><span>Runs</span></div>
   <div><b>${cp?.cricheroes_wickets??'—'}</b><span>Wickets</span></div>
   <div><b>${cp?.cricheroes_strike_rate??'—'}</b><span>SR</span></div>
   <div><b>${cp?.cricheroes_economy??'—'}</b><span>Economy</span></div>
  </div>
  ${cp?.cricheroes_profile_url?`<a target="_blank" rel="noopener" href="${esc(cp.cricheroes_profile_url)}" class="profile-link">View CricHeroes Profile ↗</a>`:''}
  <div style="margin-top:12px">Minimum bid ${money(cat?.minimum_bid)}</div>
  <div class="current-bid">${money(S.leading_team_id?S.current_bid:(cat?.minimum_bid??S.current_bid))}</div>
  <div>${S.leading_team_id?`Leading: <strong>${esc(TEAMS.find(t=>t.id===S.leading_team_id)?.name||'Team')}</strong>`:'No bid yet'}</div>
 </div>
 <div class="card section"><h2>Team Bidding</h2><p class="muted">Captains bid from their own devices. If a captain has a problem, use the admin fallback below.</p><div class="grid">${TEAMS.map(team=>teamCard(team)).join('')}</div></div>
 <div class="card section"><div class="row between"><div><h2>Admin Controls</h2><p class="muted">Use only when required or when the auction host is managing the bid.</p></div><span class="pill">Admin Override</span></div><div class="grid"><div><label>Team</label><select id="adminTeam">${TEAMS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div><label>Bid Amount</label><input id="adminBid" class="bid-input" type="number" min="0" value="${nextBid()}"></div></div><div class="row"><button class="btn bigbtn" onclick="adminBid()">🔨 Enter Bid for Captain</button><button class="btn success bigbtn" onclick="finishPlayer('sold')">✓ Sell Player</button><button class="btn danger bigbtn" onclick="finishPlayer('unsold')">✕ Unsold</button></div></div>
 ${soldPlayersByTeamCard()}\n ${unsoldPlayersCard()}
 <div class="card section"><h2>Category Order</h2>${categoryOrderEditor()}</div>
 <div class="card section"><h2>Remaining in Current Category</h2>${queueRemaining(PLAYERS.find(p=>p.player_id===S.current_player_id)?.auction_category_id).map(id=>{const p=player(id);return `<div class="queue-item">${esc(p?.display_name||p?.full_name||'Player')}</div>`}).join('')||'<div class="empty">No more players in this category.</div>'}</div>`;
}
function soldPlayersByTeamCard(){
 const total=SOLD.length;
 const totalValue=SOLD.reduce((sum,ap)=>sum+Number(ap.sold_price||0),0);
 return `<div class="card section"><div class="row between"><div><h2>Sold Players — Team Wise</h2><p class="muted">Admin view of every player sold during this auction, grouped by team.</p></div><span class="pill">${total} Sold</span></div><div class="grid">${TEAMS.map(team=>{
  const rows=SOLD.filter(ap=>ap.sold_team_id===team.id);
  const spend=rows.reduce((sum,ap)=>sum+Number(ap.sold_price||0),0);
  return `<div class="team-card"><div class="row between"><strong>${esc(team.name)}</strong><span class="pill">${rows.length} players</span></div><div class="purse">${money(spend)}</div><div class="mini">Total purchase amount</div>${rows.length?rows.map(ap=>{const p=ap.registration?.players||{};return `<div class="category-order"><div class="grow"><strong>${esc(p.display_name||p.full_name||'Player')}</strong><div class="mini">${esc(ap.registration?.auction_category_id?CATMAP[ap.registration.auction_category_id]?.name||'':'')}</div></div><strong>${money(ap.sold_price)}</strong></div>`}).join(''):'<p class="muted">No players sold to this team yet.</p>'}</div>`;
 }).join('')}</div><p class="mini">Auction total: ${money(totalValue)} · Refreshes with auction updates.</p></div>`;
}
function unsoldPlayersCard(){
 if(!UNSOLD.length)return `<div class="card section"><h2>Unsold Players</h2><p class="muted">No unsold players currently. Players marked unsold will appear here and can be re-auctioned.</p></div>`;
 const busy=S?.status==='live'&&S?.current_auction_player_id;
 return `<div class="card section"><div class="row between"><div><h2>Unsold Players</h2><p class="muted">${UNSOLD.length} player(s) available for a later round. Re-auction starts the selected player at their category minimum.</p></div><span class="pill">${UNSOLD.length} Unsold</span></div>${UNSOLD.map(ap=>{const p=ap.registration?.players||{};const cat=CATMAP[ap.category_id];return `<div class="category-order"><div class="grow"><strong>${esc(p.display_name||p.full_name||'Registered player')}</strong><div class="mini">${esc(cat?.name||'Category')} · Minimum ${money(cat?.minimum_bid)}</div></div><button class="btn secondary" onclick="reauctionPlayer('${ap.id}')" ${busy?'disabled':''}>↻ Re-auction</button></div>`}).join('')}<p class="mini">${busy?'Finish the current player before starting a re-auction.':'Select a player to start a re-auction round.'}</p></div>`;
}
async function reauctionPlayer(auctionPlayerId){
 const ap=UNSOLD.find(x=>x.id===auctionPlayerId);const name=ap?.registration?.players?.display_name||ap?.registration?.players?.full_name||'this player';
 if(!confirm(`Re-auction ${name}? The player will return to live bidding at their category minimum. No team purse is charged unless the player is sold.`))return;
 const {error}=await sb.rpc('admin_reauction_unsold_player',{p_tournament_id:T.id,p_auction_player_id:auctionPlayerId});
 if(error)return alert(error.message);
 await loadBase();
}
function nextBid(){const inc=Number(A?.bid_increment)||10;if(!S?.leading_team_id)return Number(currentCategory()?.minimum_bid??0);return Number(S.current_bid||0)+inc}
function teamCard(team){return `<div class="team-card ${S.leading_team_id===team.id?'leading':''}"><div class="row between"><strong>${esc(team.name)}</strong>${S.leading_team_id===team.id?'<span class="pill green">LEADING</span>':''}</div><div class="purse" id="purse-${team.id}">Loading…</div><div class="mini">Captain login: ${team.captain_id?'assigned':'not assigned'}</div><div class="row section"><input id="bid-${team.id}" type="number" class="bid-input" min="${nextBid()}" value="${nextBid()}"><button class="btn" onclick="captainFallback('${team.id}')">Bid</button></div></div>`}
function categoryOrderEditor(){return `<div>${CATS.map((c,i)=>`<div class="category-order"><span><strong>${i+1}</strong></span><div class="grow"><strong>${esc(c.name)}</strong><div class="mini">Minimum ${money(c.minimum_bid)}</div></div><button class="btn secondary" onclick="moveCat('${c.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="btn secondary" onclick="moveCat('${c.id}',1)" ${i===CATS.length-1?'disabled':''}>↓</button></div>`).join('')}</div>`}
async function moveCat(id,dir){if(S?.status==='live')return alert('Category order cannot be changed after auction starts.');const i=CATS.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=CATS.length)return;[CATS[i],CATS[j]]=[CATS[j],CATS[i]];for(let k=0;k<CATS.length;k++){const {error}=await sb.from('auction_categories').update({auction_order:k+1}).eq('id',CATS[k].id);if(error)return alert(error.message)}render()}
async function startAuction(){if(!confirm('Start the category-wise auction? Players will be randomly shuffled within each category.'))return;const {data,error}=await sb.rpc('start_live_auction',{p_tournament_id:T.id});if(error)return alert(error.message);const {data:s}=await sb.from('auction_sessions').select('*').eq('id',data).single();S=s;await loadWallets();render();subscribe()}
async function loadWallets(){const {data,error}=await sb.from('auction_team_wallets').select('*').eq('tournament_id',T.id);if(error)return;for(const w of data||[]){const el=$('purse-'+w.team_id);if(el)el.textContent=money(w.remaining_purse)}}
async function captainFallback(teamId){const val=Number($('bid-'+teamId).value);if(!val)return;const {error}=await sb.rpc('place_live_auction_bid',{p_tournament_id:T.id,p_team_id:teamId,p_amount:val,p_source:'admin'});if(error)return alert(error.message);await refreshSession()}
async function adminBid(){
 const val=Number($('adminBid').value),team=$('adminTeam').value;
 if(!Number.isFinite(val)||val<=0)return alert('Enter a valid bid amount greater than zero.');
 const teamName=TEAMS.find(t=>t.id===team)?.name||'selected team';
 const current=Number(S?.current_bid||0);
 const currentTeam=TEAMS.find(t=>t.id===S?.leading_team_id)?.name||'No leading team';
 const warning=`ADMIN BID OVERRIDE WARNING\n\nCurrent bid: ${money(current)}\nCurrent leading team: ${currentTeam}\nOverride bid: ${money(val)}\nNew leading team: ${teamName}\n\nThis will directly replace the current bid and make the selected team the leader, even if the amount is lower than the current bid or normal minimum increment. Continue?`;
 if(!confirm(warning))return;
 const {error}=await sb.rpc('admin_override_live_auction_bid',{p_tournament_id:T.id,p_team_id:team,p_amount:val});
 if(error)return alert(error.message);
 await refreshSession();
}
async function finishPlayer(result){if(!confirm(result==='sold'?'Sell this player to the leading team?':'Mark this player unsold?'))return;const {error}=await sb.rpc('finish_current_auction_player',{p_tournament:T.id,p_result:result});if(error)return alert(error.message);await refreshSession()}
async function refreshSession(){const {data,error}=await sb.from('auction_sessions').select('*').eq('tournament_id',T.id).single();if(error)return alert(error.message);S=data;const {data:uns,error:ue}=await sb.from('auction_players').select('id,player_registration_id,category_id,auction_status').eq('tournament_id',T.id).eq('auction_status','unsold');if(ue)return alert(ue.message);UNSOLD=(uns||[]).map(ap=>({...ap,registration:REGISTRATIONS.find(p=>p.id===ap.player_registration_id)}));const {data:sold,error:sde}=await sb.from('auction_players').select('id,player_registration_id,sold_team_id,sold_price,auction_status').eq('tournament_id',T.id).eq('auction_status','sold').order('sold_price',{ascending:false});if(sde)return alert(sde.message);SOLD=(sold||[]).map(ap=>({...ap,registration:REGISTRATIONS.find(p=>p.id===ap.player_registration_id)}));render();await loadWallets()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('auction-'+T.id).on('postgres_changes',{event:'*',schema:'public',table:'auction_sessions',filter:'tournament_id=eq.'+T.id},()=>refreshSession()).on('postgres_changes',{event:'*',schema:'public',table:'auction_team_wallets',filter:'tournament_id=eq.'+T.id},()=>loadWallets()) .on('postgres_changes',{event:'*',schema:'public',table:'auction_bids'},()=>refreshSession()).on('postgres_changes',{event:'*',schema:'public',table:'auction_players',filter:'tournament_id=eq.'+T.id},()=>refreshSession()).subscribe();loadWallets()}
loadBase();
</script></body></html>
