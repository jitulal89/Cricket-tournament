<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Auction</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🔨 Live Auction</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>
let T,A,PLAYERS=[],TEAMS=[];
async function load(){if(!(await requireAdmin()))return;await setNav();try{T=await getTournament(qs("slug"));const [{data:a},{data:r},{data:tm}]=await Promise.all([sb.from("auction_settings").select("*").eq("tournament_id",T.id).maybeSingle(),sb.from("player_registrations").select("id,player_id,auction_category_id,is_captain,players(full_name,display_name,playing_role)").eq("tournament_id",T.id).eq("status","approved"),sb.from("teams").select("id,name,captain_id").eq("tournament_id",T.id).order("name")]);A=a;TEAMS=tm||[];const cap=new Set(TEAMS.map(x=>x.captain_id).filter(Boolean));PLAYERS=(r||[]).filter(x=>!cap.has(x.player_id));if(!A||A.auction_status!=="ready"&&A.auction_status!=="live"){app.innerHTML=`<div class="card"><h2>Auction is not ready</h2><p class="muted">Complete Pre-Auction Setup and mark the auction READY before starting.</p><a class="btn" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">Open Pre-Auction Setup</a></div>`;return}app.innerHTML=`<div class="row between"><div><h1 style="font-size:36px">Live Auction</h1><p class="muted">${esc(T.name)}</p></div><a class="btn secondary" href="admin-pre-auction.html?slug=${encodeURIComponent(T.slug)}">← Setup</a></div><div class="card section"><div class="notice"><strong>Auction status:</strong> ${esc(A.auction_status.toUpperCase())}</div><div class="grid section"><div><div class="stat">${PLAYERS.length}</div><div class="muted">Auction Players</div></div><div><div class="stat">${TEAMS.length}</div><div class="muted">Teams</div></div><div><div class="stat">${money(A.starting_purse)}</div><div class="muted">Starting Purse / Team</div></div><div><div class="stat">${money(A.bid_increment)}</div><div class="muted">Bid Increment</div></div></div><button class="btn success section" onclick="startAuction()">▶ Start Auction</button></div><div class="card section"><h2>Auction Queue</h2><p class="muted">The next step is to build the live bidding controls. Players are listed by their assigned category below.</p><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>Category</th></tr></thead><tbody>${PLAYERS.map(p=>`<tr><td>${esc(p.players?.display_name||p.players?.full_name)}</td><td>${esc(p.players?.playing_role||"—")}</td><td>${esc(p.auction_category_id||"Assigned")}</td></tr>`).join("")}</tbody></table></div></div>`}catch(e){app.innerHTML=msg(e.message,"err")}}
async function startAuction(){if(!confirm("Start the auction now?"))return;const {error}=await sb.from("auction_settings").update({auction_status:"live"}).eq("tournament_id",T.id);if(error)return alert(error.message);load()}load();
</script></body></html>
