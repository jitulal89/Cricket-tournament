<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Cricket Tournament</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>
async function load(){await setNav();const slug=qs("slug");try{const t=await getTournament(slug);app.innerHTML=`<section class="hero"><div class="row">${t.logo_url?`<img class="logo logo-lg" src="${esc(t.logo_url)}">`:"<div class='logo logo-lg' style='display:grid;place-items:center;font-size:40px'>🏏</div>"}<div><span class="pill">${esc(t.status)}</span><h1>${esc(t.name)}</h1><p>${esc(t.description||"Welcome to the tournament.")}</p>${t.status==="registration_open"?`<a class="btn" href="register.html?slug=${encodeURIComponent(t.slug)}">Register as a Player</a>`:"<span class='pill'>Registration Closed</span>"}</div></div></section><div class="row section"><a class="btn secondary" href="captain-login.html?slug=${encodeURIComponent(t.slug)}">👤 Captain Login</a></div><div class="grid"><div class="card"><div class="stat">👥</div><h3>Players</h3><p class="muted">Player information will be published as the tournament progresses.</p></div><div class="card"><div class="stat">🔨</div><h3>Auction</h3><p class="muted">Auction details will appear when the admin makes the auction ready.</p></div><div class="card"><div class="stat">🏆</div><h3>Teams</h3><p class="muted">Teams and squads will appear here.</p></div></div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();
</script></body></html>
