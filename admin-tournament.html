<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Tournament</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Tournament Management</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js"></script><script>
async function load(){if(!(await requireAdmin()))return;await setNav();const slug=qs("slug");try{const t=await getTournament(slug);const {data:regs,error}=await sb.from("player_registrations").select("id,status,registered_at,players(full_name,display_name,phone,playing_role,cricheroes_profile_url)").eq("tournament_id",t.id).order("registered_at",{ascending:false});if(error)throw error;const pending=(regs||[]).filter(x=>x.status==="pending").length,approved=(regs||[]).filter(x=>x.status==="approved").length;app.innerHTML=`<div class="row between"><div class="row">${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:"<div class='logo' style='display:grid;place-items:center;font-size:30px'>🏏</div>"}<div><h1 style="font-size:36px">${esc(t.name)}</h1><p class="muted">Tournament management</p></div></div><a class="btn secondary" href="admin-dashboard.html">← Back</a></div><div class="grid section"><div class="card"><div class="stat">${regs?.length||0}</div><div class="muted">Registrations</div></div><div class="card"><div class="stat">${pending}</div><div class="muted">Pending</div></div><div class="card"><div class="stat">${approved}</div><div class="muted">Approved</div></div><div class="card"><div class="stat">${t.number_of_teams||"—"}</div><div class="muted">Teams Planned</div></div></div><div class="card section"><h2>Tournament Settings</h2><div id="sm"></div><div class="grid"><div><label>Registration status</label><select id="status"><option value="draft">Draft</option><option value="registration_open">Open Registration</option><option value="registration_closed">Closed</option></select></div><div><label>Change logo</label><input id="logo" type="file" accept="image/*"></div></div><div class="row"><button class="btn" onclick="saveSettings('${t.id}','${encodeURIComponent(t.slug)}')">Save Settings</button><a class="btn secondary" href="tournament.html?slug=${encodeURIComponent(t.slug)}">View Public Page</a></div></div><div class="card section"><h2>Auction Settings</h2><p class="muted">These settings can be updated at any time before the auction starts.</p><div id="am"></div><div class="grid"><div><label>Auction mode</label><select id="mode"><option value="category">Category based</option><option value="open">Open auction</option></select></div><div><label>Default minimum bid</label><input id="minBid" type="number" min="0"></div><div><label>Bid increment</label><input id="inc" type="number" min="1"></div><div><label>Starting team purse</label><input id="purse" type="number" min="0"></div></div><button class="btn" onclick="saveAuction('${t.id}')">Save Auction Settings</button></div><div class="card section"><h2>Player Registrations</h2><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${(regs||[]).map(r=>`<tr><td><strong>${esc(r.players?.display_name||r.players?.full_name)}</strong><br><span class="muted">${esc(r.players?.phone||"")}</span>${r.players?.cricheroes_profile_url?`<br><a target="_blank" href="${esc(r.players.cricheroes_profile_url)}">CricHeroes ↗</a>`:""}</td><td>${esc(r.players?.playing_role||"—")}</td><td><span class="pill ${r.status==="approved"?"green":r.status==="rejected"?"red":""}">${esc(r.status)}</span></td><td>${r.status==="pending"?`<button class="btn" onclick="review('${r.id}','approved','${encodeURIComponent(t.slug)}')">Approve</button> <button class="btn danger" onclick="review('${r.id}','rejected','${encodeURIComponent(t.slug)}')">Reject</button>`:"—"}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No registrations.</td></tr>`}</tbody></table></div></div><div class="card section"><h2>Pre-Auction Setup</h2><p class="muted">Decide teams, select captains and assign every auction player to a category.</p><a class="btn" href="admin-pre-auction.html?slug=${encodeURIComponent(t.slug)}">Open Pre-Auction Setup →</a></div>`;status.value=t.status;const {data:a}=await sb.from("auction_settings").select("*").eq("tournament_id",t.id).maybeSingle();if(a){mode.value=a.auction_mode||"category";minBid.value=Number(a.default_minimum_bid)||0;inc.value=Number(a.bid_increment)||10;purse.value=Number(a.starting_purse)||0}}catch(e){app.innerHTML=msg(e.message,"err")}}
async function saveSettings(id,slug){const m=document.getElementById("sm");try{let u=null;if(logo.files[0])u=await uploadLogo(logo.files[0],id);const patch={status:status.value};if(u)patch.logo_url=u;const {error}=await sb.from("tournaments").update(patch).eq("id",id);if(error)throw error;m.innerHTML=msg("Tournament settings saved.");setTimeout(()=>location.reload(),400)}catch(e){m.innerHTML=msg(e.message,"err")}}
async function saveAuction(id){const m=document.getElementById("am");const {error}=await sb.from("auction_settings").update({auction_mode:mode.value,default_minimum_bid:Number(minBid.value)||0,bid_increment:Number(inc.value)||1,starting_purse:Number(purse.value)||0}).eq("tournament_id",id);m.innerHTML=error?msg(error.message,"err"):msg("Auction settings saved.")}
async function review(id,status,slug){const {error}=await sb.from("player_registrations").update({status,reviewed_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else location.href="admin-tournament.html?slug="+slug}load();
</script></body></html>
