<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Tournament</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Tournament Management</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=21"></script><script>
async function load(){if(!(await requireAdmin()))return;await setNav();const slug=qs("slug");try{const t=await getTournament(slug);const {data:regs,error}=await sb.from("player_registrations").select("id,status,registered_at,players(full_name,display_name,phone,playing_role,cricheroes_profile_url)").eq("tournament_id",t.id).order("registered_at",{ascending:false});if(error)throw error;const pending=(regs||[]).filter(x=>x.status==="pending").length,approved=(regs||[]).filter(x=>x.status==="approved").length;app.innerHTML=`<div class="row between"><div class="row">${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:"<div class='logo' style='display:grid;place-items:center;font-size:30px'>🏏</div>"}<div><h1 style="font-size:36px">${esc(t.name)}</h1><p class="muted">Tournament management</p></div></div><a class="btn secondary" href="admin-dashboard.html">← Back</a></div><div class="grid section"><div class="card"><div class="stat">${regs?.length||0}</div><div class="muted">Registrations</div></div><div class="card"><div class="stat">${pending}</div><div class="muted">Pending</div></div><div class="card"><div class="stat">${approved}</div><div class="muted">Approved</div></div><div class="card"><div class="stat">${t.number_of_teams||"—"}</div><div class="muted">Teams Planned</div></div></div><div class="card section"><h2>Tournament Settings</h2><div id="sm"></div><div class="grid"><div><label>Registration status</label><select id="status"><option value="draft">Draft</option><option value="registration_open">Open Registration</option><option value="registration_closed">Closed</option></select></div><div><label>Change logo</label><input id="logo" type="file" accept="image/*"></div></div><div class="row"><button class="btn" onclick="saveSettings('${t.id}','${encodeURIComponent(t.slug)}')">Save Settings</button><a class="btn secondary" href="tournament.html?slug=${encodeURIComponent(t.slug)}">View Public Page</a></div></div><div class="card section"><h2>Player Registrations</h2><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${(regs||[]).map(r=>`<tr><td><strong>${esc(r.players?.display_name||r.players?.full_name)}</strong><br><span class="muted">${esc(r.players?.phone||"")}</span>${r.players?.cricheroes_profile_url?`<br><a target="_blank" href="${esc(r.players.cricheroes_profile_url)}">CricHeroes ↗</a>`:""}</td><td>${esc(r.players?.playing_role||"—")}</td><td><span class="pill ${r.status==="approved"?"green":r.status==="rejected"?"red":""}">${esc(r.status)}</span></td><td>${r.status==="pending"?`<button class="btn" onclick="review('${r.id}','approved','${encodeURIComponent(t.slug)}')">Approve</button> <button class="btn danger" onclick="review('${r.id}','rejected','${encodeURIComponent(t.slug)}')">Reject</button>`:"—"}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No registrations.</td></tr>`}</tbody></table></div></div><div class="card section" style="border:2px solid #2563eb">
<h2>🏏 Pre-Auction Setup</h2>
<p class="muted">Prepare teams, select captains, create categories and assign approved players before the auction.</p>
<div class="grid">
<div><div class="stat">${t.number_of_teams||"—"}</div><div class="muted">Teams Planned</div></div>
<div><div class="stat">${approved}</div><div class="muted">Approved Players</div></div>
</div>
<div class="row">
<a class="btn" href="admin-pre-auction.html?slug=${encodeURIComponent(t.slug)}">Open Pre-Auction Setup →</a>
<a class="btn secondary" href="admin-teams.html?slug=${encodeURIComponent(t.slug)}">Manage Teams</a>
</div>
</div>`;status.value=t.status}catch(e){app.innerHTML=msg(e.message,"err")}}
async function saveSettings(id,slug){const m=document.getElementById("sm");try{let u=null;if(logo.files[0])u=await uploadLogo(logo.files[0],id);const patch={status:status.value};if(u)patch.logo_url=u;const {error}=await sb.from("tournaments").update(patch).eq("id",id);if(error)throw error;m.innerHTML=msg("Tournament settings saved.");setTimeout(()=>location.reload(),400)}catch(e){m.innerHTML=msg(e.message,"err")}}

async function review(id,status,slug){const {error}=await sb.from("player_registrations").update({status,reviewed_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else location.href="admin-tournament.html?slug="+slug}load();
</script></body></html>
