<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Teams</div><nav id="nav" class="nav"></nav></header><main id="app"></main><script src="app.js?v=14"></script><script>
async function load(){if(!(await requireAdmin()))return;await setNav();try{const t=await getTournament(qs("slug"));const {data:teams,error}=await sb.from("teams").select("id,name,captain_id,players:captain_id(full_name,display_name)").eq("tournament_id",t.id).order("name");if(error)throw error;app.innerHTML=`<div class="row between"><div><h1 style="font-size:36px">Teams</h1><p class="muted">${esc(t.name)}</p></div><a class="btn secondary" href="admin-tournament.html?slug=${encodeURIComponent(t.slug)}">← Tournament</a></div><div class="grid section">${(teams||[]).map(x=>`<div class="card"><h2>${esc(x.name)}</h2><p><strong>Captain:</strong> ${esc(x.players?.display_name||x.players?.full_name||"Not selected")}</p><a class="btn secondary" href="teams.html?slug=${encodeURIComponent(t.slug)}">Public Teams</a></div>`).join("")||`<div class="card empty">No teams yet.</div>`}</div>`}catch(e){app.innerHTML=msg(e.message,"err")}}load();</script></body></html>
