<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Tournament</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Create Tournament</div><nav id="nav" class="nav"></nav></header><main><div class="card" style="max-width:760px;margin:auto"><h2>Create Tournament</h2><p class="muted">Auction settings can be changed later from the tournament management pages.</p><div id="m"></div><label>Tournament name *</label><input id="name" placeholder="City Premier League 2027"><label>URL slug *</label><input id="slug" placeholder="city-premier-league-2027"><label>Description</label><textarea id="desc" rows="3"></textarea><label>Tournament logo</label><input id="logo" type="file" accept="image/*"><div id="preview" class="row"></div><label>Maximum teams</label><input id="maxTeams" type="number" min="2" value="6"><label>Number of teams planned</label><input id="numTeams" type="number" min="2" value="4"><label>Maximum players</label><input id="maxPlayers" type="number" min="1" value="100"><label>Registration status</label><select id="status"><option value="draft">Draft</option><option value="registration_open">Open Registration</option></select><hr class="divider"><h3>Initial Auction Settings</h3><label>Auction mode</label><select id="mode"><option value="category">Category based</option><option value="open">Open auction</option></select><label>Default minimum bid</label><input id="minBid" type="number" min="0" value="100"><label>Bid increment</label><input id="inc" type="number" min="1" value="10"><label>Starting team purse</label><input id="purse" type="number" min="0" value="1000"><div class="row"><a class="btn secondary" href="admin-dashboard.html">Cancel</a><button class="btn" onclick="create()">Create Tournament</button></div></div></main><script src="app.js?v=14"></script><script>
setNav();logo.onchange=()=>{const f=logo.files[0];preview.innerHTML=f?`<img class="logo" src="${URL.createObjectURL(f)}"><span>${esc(f.name)}</span>`:""};async function create(){if(!(await requireAdmin()))return;const m=document.getElementById("m");const s=slugify(slug.value);if(!name.value.trim()||!s){m.innerHTML=msg("Tournament name and slug are required.","err");return}const {data:{user}}=await sb.auth.getUser();const {data:t,error}=await sb.from("tournaments").insert({name:name.value.trim(),slug:s,description:desc.value.trim()||null,max_teams:Number(maxTeams.value)||null,number_of_teams:Number(numTeams.value)||null,max_players:Number(maxPlayers.value)||null,status:status.value,created_by:user.id}).select().single();if(error){m.innerHTML=msg(error.message,"err");return}try{const u=await uploadLogo(logo.files[0],t.id);if(u){const {error:e}=await sb.from("tournaments").update({logo_url:u}).eq("id",t.id);if(e)throw e}}catch(e){m.innerHTML=msg("Tournament created, but logo upload failed: "+e.message,"err");return}const {error:ae}=await sb.from("auction_settings").insert({tournament_id:t.id,auction_enabled:true,auction_mode:mode.value,default_minimum_bid:Number(minBid.value)||0,bid_increment:Number(inc.value)||10,starting_purse:Number(purse.value)||0,auction_status:"setup"});if(ae){m.innerHTML=msg("Tournament created, but auction settings failed: "+ae.message,"err");return}await sb.from("registration_forms").insert({tournament_id:t.id});location.href="admin-tournament.html?slug="+encodeURIComponent(s)}</script></body></html>
