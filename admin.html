<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">🏏 Cricket Tournament · Admin</div><nav id="nav" class="nav"></nav></header><main><div class="card" style="max-width:460px;margin:30px auto"><h2>Admin Login</h2><p class="muted">Sign in to manage tournaments.</p><div id="m"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" onclick="login()">Sign in</button></div></main><script src="app.js?v=16"></script><script>setNav();async function login(){const m=document.getElementById("m");const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.innerHTML=msg(error.message,"err");return}if(!(await isAdmin())){await sb.auth.signOut();m.innerHTML=msg("This account is not an administrator.","err");return}location.href="admin-dashboard.html"}</script></body></html>
